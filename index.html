<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Same Words</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<style>
/* Same Words — three places: Learn (levels -> lessons with a story), Words (search the whole list), My words. */
:root {
  --bg: #f5f6f8;
  --card: #ffffff;
  --fg: #15181e;
  --muted: #687080;
  --line: #e0e3e9;
  --accent: #1f5fbf;
  --accent-soft: #e7eefb;
  --ok: #1e8a57;
  --bad: #c0392b;
  --word: "Literata", "PT Serif", Georgia, "Times New Roman", serif;
  --ui: "Golos Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --shadow: 0 1px 2px rgba(20, 28, 45, .05), 0 3px 10px rgba(20, 28, 45, .04);
  --a0: #2a9d68; --a1: #2687b8; --a2: #3b68d4; --b1: #7656d2; --b2: #b84f93; --c1: #cf7a22;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216; --card: #1a1d23; --fg: #eceef2; --muted: #9aa1ae; --line: #2b2f38;
    --accent: #7eaaf0; --accent-soft: #1c2940; --ok: #4cc38a; --bad: #ff7b72; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101216; --card: #1a1d23; --fg: #eceef2; --muted: #9aa1ae; --line: #2b2f38;
  --accent: #7eaaf0; --accent-soft: #1c2940; --ok: #4cc38a; --bad: #ff7b72; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 76px; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--ui); min-height: 100vh; display: flex; flex-direction: column; }
a { color: var(--accent); text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1080px; margin: 0 auto; padding: 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 12px; }
.brand { font-family: var(--word); font-weight: 600; font-size: 19px; color: var(--fg); white-space: nowrap; margin-right: auto; }
.brand span { color: var(--muted); font-weight: 500; }
.menu { display: flex; gap: 2px; }
.menu a { padding: 7px 13px; border-radius: 999px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.menu a:hover { color: var(--fg); }
.menu a[aria-current="page"] { color: var(--fg); background: var(--card); box-shadow: var(--shadow); }
.menu small { color: var(--muted); font-size: 12px; margin-left: 4px; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .brand span { display: none; } .menu { gap: 0; } .menu a { padding: 7px 8px; font-size: 14px; } .brand { font-size: 17px; } .top-in { gap: 6px; } }

main { width: 100%; max-width: 1080px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-left, 0px)) 40px; flex: 1 0 auto; }
@media (max-width: 560px) { main { padding-top: 20px; } }
h1 { font-family: var(--word); font-weight: 600; font-size: clamp(26px, 4vw, 34px); line-height: 1.15; letter-spacing: -.01em; margin: 0 0 8px; }
h2 { font-family: var(--word); font-weight: 600; font-size: 20px; margin: 0 0 12px; }
.lead { color: var(--muted); font-size: 16px; max-width: 62ch; margin: 0 0 26px; }
.crumbs { font-size: 13.5px; color: var(--muted); margin: 0 0 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.blank { color: var(--muted); text-align: center; padding: 48px 0; }
.foot { max-width: 1080px; margin: 0 auto; padding: 8px 16px 32px; color: var(--muted); font-size: 12px; text-align: center; opacity: .85; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); font-weight: 500; color: var(--fg); white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--card); padding: 2px; }
.seg button { padding: 6px 12px; border-radius: 999px; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

/* Learn: levels */
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 0 0 40px; }
@media (max-width: 900px) { .levels { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .levels { grid-template-columns: minmax(0, 1fr); } }
.lv { display: flex; gap: 14px; padding: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: var(--shadow); color: inherit; min-width: 0; }
.lv:hover { border-color: var(--lc); }
.lv .code { flex: none; width: 54px; height: 54px; border-radius: 15px; display: grid; place-items: center; color: #fff;
  font: 600 21px var(--word); background: var(--lc); }
.lv .body { min-width: 0; flex: 1; }
.lv .name { font: 600 18px var(--word); }
.lv .about { color: var(--muted); font-size: 13.5px; line-height: 1.4; margin-top: 2px; }
.lv .sample { margin-top: 8px; }
@media (max-width: 560px) { .lv { padding: 14px 16px; } .lv .sample { display: none; } .lv .code { width: 46px; height: 46px; font-size: 19px; border-radius: 13px; } }
.lv .stats { color: var(--muted); font-size: 12.5px; margin-top: 8px; font-variant-numeric: tabular-nums; }
.prog { height: 4px; border-radius: 4px; background: var(--line); margin-top: 6px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--lc); border-radius: 4px; }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 380px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.all-link { display: inline-block; margin-top: 16px; font-weight: 500; }
.col { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 16px; background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; box-shadow: var(--shadow); color: inherit; min-width: 0; }
.col:hover { border-color: var(--accent); }
.col b { font: 600 16.5px var(--word); }
.col span { color: var(--muted); font-size: 13px; line-height: 1.4; }

/* level page: sections of lessons */
.lvhead { display: flex; gap: 16px; align-items: center; margin-bottom: 6px; }
.lvhead .code { width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; color: #fff; font: 600 20px var(--word); background: var(--lc); flex: none; }
.lvhead h1 { margin: 0; }
.secnav { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 26px; }
.secnav button { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 13px; color: var(--muted); }
.secnav button:hover { color: var(--fg); }
.sec { margin: 0 0 30px; scroll-margin-top: 76px; }
.lessons { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .lessons { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .lessons { grid-template-columns: minmax(0, 1fr); } }
.ls { display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: var(--shadow); color: inherit; min-width: 0; }
.ls:hover { border-color: var(--lc, var(--accent)); }
.ls .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.ls .n .ok { color: var(--ok); font-weight: 500; }
.ls b { font: 600 16.5px var(--word); line-height: 1.25; }
.ls .w { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* lesson page */
.lesson-meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; margin-bottom: 6px; }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; color: #fff; font-size: 12.5px; font-weight: 600; background: var(--lc, var(--accent)); }
.story { font-size: 18px; line-height: 1.72; max-width: 68ch; white-space: pre-line; background: var(--card); border: 1px solid var(--line);
  border-radius: 18px; padding: 20px 24px; margin: 14px 0 18px; box-shadow: var(--shadow); }
@media (max-width: 560px) { .story { font-size: 17px; padding: 16px 18px; } }
.story .sw { font-weight: 600; color: var(--fg); background: linear-gradient(to top, var(--accent-soft) 48%, transparent 48%); border-radius: 2px; cursor: pointer; }
.story .sw:hover { color: var(--accent); }
.story-hint { color: var(--muted); font-size: 13px; margin: -10px 0 18px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 16px; }
.actions .spacer { flex: 1; }
.btn.done { color: var(--ok); border-color: var(--ok); }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 26px; font-size: 14.5px; }

/* Words: search and filters */
.search-row { position: relative; margin: 0 0 12px; }
.search-row svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search { width: 100%; padding: 13px 16px 13px 44px; font: inherit; font-size: 16px; color: var(--fg); border-radius: 14px;
  border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); }
.search:focus { outline: none; border-color: var(--accent); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 16px; }
.sel { appearance: none; -webkit-appearance: none; padding: 7px 30px 7px 12px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer;
  font: inherit; font-size: 14px; color: var(--fg); width: 170px; max-width: 100%; text-overflow: ellipsis;
  background: var(--card) linear-gradient(45deg, transparent 50%, var(--muted) 50%) no-repeat calc(100% - 16px) 52% / 5px 5px,
              var(--card) linear-gradient(135deg, var(--muted) 50%, transparent 50%) no-repeat calc(100% - 11px) 52% / 5px 5px; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); padding: 6px 4px; cursor: pointer; }
.count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.filters .count { margin-left: auto; }
@media (max-width: 560px) {
  .filters { display: grid; grid-template-columns: 1fr 1fr; }
  .filters .sel { width: 100%; }
  .filters .seg { grid-column: 1 / -1; justify-self: start; }
  .filters .count { grid-column: 1 / -1; margin: 0; }
}

/* cards (flip) */
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.grid .card { aspect-ratio: 1 / 1.08; }
@media (max-width: 900px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .grid .card { aspect-ratio: 1 / 1.12; } }
@media (max-width: 640px) { .grid { grid-template-columns: minmax(0, 440px); justify-content: center; gap: 12px; } .grid .card { aspect-ratio: 5 / 4; } }
.card { position: relative; perspective: 1000px; aspect-ratio: 4 / 5; cursor: pointer; border-radius: 14px; max-width: 100%; container-type: inline-size; }
.inner { position: absolute; inset: 0; transition: transform .45s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; }
.card.flipped .inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 14px; text-align: center; min-width: 0; }
.back { transform: rotateY(180deg); justify-content: flex-start; align-items: stretch; text-align: left; gap: 8px; overflow-y: auto; scrollbar-width: thin; }
.back.more-below { -webkit-mask-image: linear-gradient(#000 calc(100% - 22px), transparent); mask-image: linear-gradient(#000 calc(100% - 22px), transparent); }
.en, .uk { font-family: var(--word); line-height: 1.12; overflow-wrap: break-word; hyphens: manual; max-width: 100%; }
.en { font-size: clamp(24px, 2.9vw, 34px); font-size: clamp(22px, min(16cqi, 150cqi / var(--n, 6)), var(--max-en, 60px)); font-weight: 600; }
.uk { font-size: clamp(21px, 2.5vw, 29px); font-size: clamp(19px, min(13.5cqi, 135cqi / var(--n, 6)), var(--max-uk, 50px)); font-weight: 500; color: var(--muted); }
.eq { color: var(--muted); opacity: .6; font: 400 20px/1 var(--ui); font-size: clamp(18px, 7.5cqi, 30px); margin: .3em 0 .2em; }
.st { color: var(--accent); text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: .16em;
  text-decoration-color: color-mix(in srgb, var(--accent) 60%, transparent); }
.ukst { font: 500 12.5px/1.3 var(--ui); color: var(--muted); margin-top: 8px; letter-spacing: .01em; }
.ukst b { color: var(--fg); font-weight: 600; }
.more { display: flex; justify-content: center; padding-top: 12px; }
.flag { position: absolute; top: 12px; left: 12px; width: 22px; height: 14px; border-radius: 2px; box-shadow: 0 0 0 1px var(--line); }
.icon { position: absolute; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
@media (hover: hover) { .icon:hover { background: var(--accent-soft); color: var(--accent); } }
.icon svg { width: 18px; height: 18px; }
.icon.busy { color: var(--accent); }
.icon.busy svg { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.say { bottom: 6px; left: 6px; }
.mk { position: absolute; bottom: 12px; right: 12px; font-size: 11.5px; line-height: 1.5; padding: 0 8px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.mk-s { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.add { top: 6px; right: 6px; }
.add.on { color: var(--accent); }
@media (pointer: coarse) { .icon { width: 44px; height: 44px; } .say { bottom: 2px; left: 2px; } .add { top: 2px; right: 2px; } }
.card.flash .face { box-shadow: 0 0 0 3px var(--accent); transition: box-shadow .2s; }
.back .b-top { display: flex; flex-direction: column; gap: 8px; flex: none; }
.back .pic { flex: none; width: 100%; aspect-ratio: 3 / 1; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; color: var(--line); }
.back .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.back .pic svg { width: 30px; height: 30px; }
.back .pic.has { border: 0; }
.back .pic.emoji { position: relative; border-color: transparent; background: var(--accent-soft); }
.back .pic.emoji img { position: absolute; inset: 0; margin: auto; width: 100%; height: 100%; max-width: 160px; max-height: 160px; object-fit: contain; padding: 8px; }
.back .id { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.back .txt { display: flex; flex-direction: column; gap: 6px; min-height: 0; min-width: 0; flex: 1 0 auto; }
.back .head { display: flex; align-items: center; gap: 6px; font-family: var(--word); font-weight: 600; font-size: 19px; line-height: 1.2; }
.back .head > span { min-width: 0; overflow-wrap: anywhere; }
.back .meta { font-size: 12.5px; color: var(--muted); }
.back .head .say-btn { position: static; flex: none; width: 28px; height: 28px; margin-left: auto; }
.back .rank { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.grid .back .b-top { flex-direction: row; align-items: flex-start; gap: 10px; }
.grid .back .pic { width: 30%; max-width: 96px; aspect-ratio: 1; }
.grid .back .id { flex: 1; }
.back .say-line { font-size: 13px; }
.back .say-line span { color: var(--muted); }
.back ol { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 1.32; }
.back ol b { font-weight: 600; color: var(--fg); }
.back .note { margin-top: auto; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font: 400 11.5px var(--ui); letter-spacing: .02em; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.loading { color: var(--muted); font-size: 13px; }
.single { display: flex; flex-direction: column; align-items: center; gap: 16px; --max-en: 84px; --max-uk: 70px; }
.single .card { width: min(620px, 100%); aspect-ratio: 3 / 2; touch-action: pan-y; }
.single .back { display: grid; grid-template-columns: 38% minmax(0, 1fr); grid-template-rows: auto 1fr; gap: 8px 16px; align-content: start; }
.single .back .b-top { display: contents; }
.single .back .pic { grid-column: 1; grid-row: 1 / span 2; aspect-ratio: auto; height: 100%; }
.single .back .id { grid-column: 2; grid-row: 1; }
.single .back .txt { grid-column: 2; grid-row: 2; }
.single .back ol { font-size: 15px; gap: 6px; }
@media (max-width: 560px) {
  .single .card { aspect-ratio: 4 / 5; }
  .single .back { display: flex; flex-direction: column; }
  .single .back .b-top { display: flex; }
  .single .back .pic { aspect-ratio: 3 / 1; height: auto; }
}
.nav { display: flex; gap: 10px; align-items: center; }
.nav .btn { min-width: 48px; justify-content: center; }

/* list view: one compact row per word */
.rows { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.rw { display: grid; grid-template-columns: 40px minmax(0, 1fr) 20px minmax(0, 1fr) auto 40px; align-items: center; gap: 6px; padding: 6px 10px; border-top: 1px solid var(--line); }
.rw:first-child { border-top: 0; }
.rw { cursor: pointer; }
@media (hover: hover) { .rw:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); } }
.rw.open { background: var(--accent-soft); }
.rw-more { display: flex; gap: 14px; padding: 4px 16px 14px 56px; background: var(--accent-soft); }
.rw-more .d-pic { flex: none; width: 72px; height: 72px; object-fit: contain; border-radius: 10px; background: var(--card); padding: 6px; }
.rw-more .d-txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; font-size: 14px; }
.rw-more .meta { color: var(--muted); font-size: 13px; }
.rw-more ol { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; line-height: 1.38; }
.rw-more .note { color: var(--muted); font-size: 13px; }
@media (max-width: 560px) { .rw-more { padding: 4px 14px 14px 14px; } .rw-more .d-pic { width: 56px; height: 56px; } }
.rw .icon { position: static; }
.rw .r-en { font: 600 18px var(--word); overflow-wrap: anywhere; }
.rw .r-uk { font: 500 17px var(--word); color: var(--muted); overflow-wrap: anywhere; }
.rw .r-eq { color: var(--muted); text-align: center; }
.rw .r-m { color: var(--muted); font-size: 12px; white-space: nowrap; text-align: right; }
@media (max-width: 560px) { .rw { grid-template-columns: 36px minmax(0, 1fr) 14px minmax(0, 1fr) 36px; } .rw .r-m { display: none; } .rw .r-en { font-size: 16px; } .rw .r-uk { font-size: 15px; } }
.continue { margin: -8px 0 26px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.continue .stat { color: var(--muted); font-size: 13.5px; }
.answer { font: 500 20px var(--ui); padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); width: min(360px, 100%); text-align: center; }
.answer:focus { outline: none; border-color: var(--accent); }
.verdict { font-size: 15px; } .verdict.ok { color: var(--ok); } .verdict.no { color: #c0392b; }

/* home */
.hero { margin: 0 0 36px; }
.hero h1 { font-size: clamp(28px, 5vw, 42px); max-width: 21ch; }
.en-sub { color: var(--muted); font-size: 14px; margin: -2px 0 14px; }
.hero .lead { margin-bottom: 18px; color: var(--fg); }
.demo-l { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.demo { display: flex; flex-wrap: wrap; gap: 8px; }
.demo-b { display: inline-flex; align-items: center; gap: 8px; padding: 9px 12px 9px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); box-shadow: var(--shadow); font-size: 16px; }
.demo-b:hover { border-color: var(--accent); }
.demo-b .arr { color: var(--muted); }
.demo-b [lang=en] { font-family: var(--word); font-weight: 600; font-size: 17px; }
.demo-b [lang=en] b { color: var(--accent); font-weight: 700; }
.demo-b svg { width: 18px; height: 18px; color: var(--accent); }
.demo-after { margin: 10px 0 0; }

  function storyHTML(text) {   // [[word]] or [[form|word]] -> a highlighted, clickable word; each sentence in a span (to read it aloud)

    String(text).split(/(\[\[[^\]]+\]\])/).forEach(p => {

        const w = BY_EN.get((m[2] || m[1]).trim());

      while ((mm = re.exec(p))) { cur += esc(p.slice(last, mm.index + mm[1].length)); flush(); html += mm[2]; last = mm.index + mm[0].length; }

  // ---------- Words: search and filters over the whole list
  const fold = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’ʼ]/g, "'");
  WORDS.forEach(w => { w._k = fold(w.en) + '\n' + fold(w.uk); });

  function wordsBase(all) {
    if (state.kind === 'sim') return state.band ? SIM.filter(w => w.band === state.band) : SIM;
    let l = state.band ? WORDS.filter(w => w.band === state.band) : WORDS;
    if (state.hideNs && !all) l = l.filter(slangOk);

  function wordsList() {
    const q = fold(state.q.trim());

      let l = wordsBase(all);

      if (q) {
        const starts = [], has = [];
        l.forEach(w => { const i = w._k.indexOf(q); if (i === 0 || w._k.indexOf('\n' + q) >= 0) starts.push(w); else if (i > 0) has.push(w); });
        l = starts.concat(has);
      }
      return l;
    };
    let l = run(false);
    state.widened = false;

  // ---------- Practice: one checked task per screen

  function stressFb(w, sy) {

    return (u ? 'Українською — ' + esc(u) + '. ' : '') + 'Англійською — <b lang="en">' + esc(capsEn(w, sy)) + '</b>.' + (SOUND_NOTE[w.en] ? ' ' + SOUND_NOTE[w.en] : '');
  }
  function viewPractice() {
    if (!tr) {
      const m = WORDS.filter(w => mine.has(w.id));
      if (m.length) { startSession(itemsFor(m), 'Мої слова'); return; }
      $('#main').innerHTML = '<h1>Тренування</h1><p class="lead">Відкрийте урок і натисніть «Тренувати ці слова» або збережіть слова кнопкою +.</p>' +
        '<div class="actions"><button class="btn primary" id="daily">5 хвилин сьогодні</button><a class="btn" href="#learn">До уроків</a></div>';
      return;
    }
    if (tr.i >= tr.items.length) return practiceDone();
    const it = tr.items[tr.i], w = it.w, r = tr.res;
    let task = '', body = '', foot = '';
    if (it.f === 'pick') {
      task = 'Послухайте й оберіть слово';
      if (!it.opts) {
        const others = shuffled(tr.pool.filter(x => x !== w && x.uk !== w.uk)).slice(0, 2);
        const extra = shuffled(WORDS.slice(0, 300).filter(x => x !== w && x.uk !== w.uk && others.indexOf(x) < 0)).slice(0, 2 - others.length);
        it.opts = shuffled([w].concat(others, extra));
      }
      body = '<div class="pcard">' + (r ? pair(w) : sayBig(w) + '<div class="hint">Торкніться, щоб послухати ще раз</div>') + '</div>' +
        '<div class="opts">' + it.opts.map((o, k) => '<button class="opt' + (r ? (o === w ? ' good' : o === r.pick ? ' bad' : '') : '') + '" data-opt="' + k + '"' +
          (r ? ' disabled' : '') + ' lang="uk">' + esc(o.uk) + '</button>').join('') + '</div>';
      foot = r ? nextRow() : '';
    } else if (it.f === 'stress') {
      const sy = sylls(w);
      task = 'Де наголос? Торкніться наголошеного складу';
      body = '<div class="pcard"><div class="uk-small" lang="uk">' + esc(w.uk) + '</div><div class="syl" lang="en">' +
        sy.parts.map((p, k) => '<button class="sy' + (r ? (k === sy.k ? ' good' : k === r.pick ? ' bad' : '') : '') + '" data-syl="' + k + '"' + (r ? ' disabled' : '') + '>' +
          esc(r && k === sy.k ? p.t.toUpperCase() : p.t) + '</button>').join('<span class="dot">·</span>') + '</div>' +
        (r ? '<div class="fb">' + stressFb(w, sy) + '</div>' : '') + '</div>';
      foot = r ? nextRow() : '';
    } else if (it.f === 'hear') {
      task = 'Послухайте й напишіть слово англійською';
      body = '<div class="pcard">' + (r ? pair(w) : sayBig(w) + '<div class="hint">Торкніться, щоб послухати ще раз</div>') + '</div>';
      foot = typeFoot(r, w.en);
    } else if (it.f === 'type') {
      task = 'Напишіть англійською';
      body = '<div class="pcard">' + (r ? pair(w) : big('uk big', w, w.uk) + (w.sim ? '<div class="hint">≈ майже так само англійською</div>' : '')) + '</div>';
      foot = typeFoot(r, w.en);
    } else if (it.f === 'say') {
      task = it.shown ? 'Ви сказали правильно?' : 'Скажіть англійською вголос, потім перевірте';
      body = '<div class="pcard">' + (it.shown ? pair(w) : big('uk big', w, w.uk) + '<div class="eq">' + (w.sim ? '≈' : '=') + '</div><div class="en q">?</div>') + '</div>';
      foot = '<div class="row">' + (it.shown ? '<button class="btn" id="t-again">Ще раз</button><button class="btn primary" id="t-know">Знаю</button>'
        : '<button class="btn primary" id="t-show">Показати</button>') + '</div>';
    } else if (it.f === 'fill') {
      task = 'Послухайте й допишіть літери';
      body = '<div class="pcard">' + sayBig(w) + '<div class="pat" lang="en">' + esc(it.pat).replace(/_+/, m => '<span class="gap">' + (r ? esc(it.ans) : m.replace(/_/g, '_ ').trim()) + '</span>') + '</div>' +
        (r ? '<div class="fb">' + it.fb + '</div>' : '') + '</div>';
      foot = typeFoot(r, it.ans);
    } else if (it.f === 'gap') {
      task = it.ff ? 'Обережно, схоже слово! Що це означає?' : 'Яке слово підходить?';
      body = '<div class="pcard"><div class="gsent" lang="en">' + esc(it.text).replace('___', '<span class="gap">' + (r ? esc(it.ans) : '&nbsp;?&nbsp;') + '</span>') + '</div>' +
        (r ? '<div class="fb">' + it.fb + '</div>' : '') + '</div>' +
        '<div class="opts">' + it.opts.map((o, k) => '<button class="opt' + (r ? (o === it.ans ? ' good' : o === r.pick ? ' bad' : '') : '') + '" data-opt="' + k + '"' +
          (r ? ' disabled' : '') + ' lang="' + (it.ff ? 'uk' : 'en') + '">' + esc(o) + '</button>').join('') + '</div>';
      foot = r ? nextRow() : '';
    } else {
      body = '<div class="pcard info' + (it.warn ? ' warn' : '') + '"><div class="i-title">' + esc(it.title) + '</div><div class="i-text">' + it.html + '</div></div>';
      foot = nextRow();
    }
    const done_ = Math.min(tr.i, tr.items.length);
    $('#main').innerHTML = '<div class="train">' +
      '<div class="ptop"><span class="hint">' + esc(tr.title) + '</span><div class="pbar"><i style="width:' + Math.round(100 * done_ / tr.items.length) + '%"></i></div></div>' +
      (task ? '<div class="task">' + task + '</div>' : '') + body + foot +
      '<div class="count">' + (tr.i + 1) + ' / ' + tr.items.length + '</div>' +
      (tr.kind === 'first' ? '' : '<details class="pmode"><summary>Як тренуватися?</summary>' + modeSwitch() + '</details>') + '</div>';
    if (!r && (it.f === 'hear' || it.f === 'type' || it.f === 'fill')) { const a = $('#t-ans'); if (a) a.focus({ preventScroll: true }); }
    else if (r || it.f === 'info') { const b = $('#t-next'); if (b) b.focus({ preventScroll: true }); }
    if (!r && (it.f === 'pick' || it.f === 'hear' || it.f === 'fill') && it.played !== tr.i) { it.played = tr.i; playWord(w); }
  }
  function modeSwitch() {
    const m = state.pmode || 'mix';
    return '<div class="seg" role="group" aria-label="Як тренуватися">' +
      [['mix', 'Мікс'], ['say', 'Скажіть'], ['hear', 'Слухайте'], ['type', 'Пишіть']].map(x =>
        '<button data-pmode="' + x[0] + '" aria-pressed="' + (m === x[0]) + '">' + x[1] + '</button>').join('') + '</div>';
  }
  function settle(ok, extra, quiet) {   // record the answer to the current task
    const it = tr.items[tr.i];
    tr.res = Object.assign({ ok }, extra || {});
    if (it.w && !it.again) {
      if (!ok) tr.missed.add(it.w.id);
      if (--tr.left[it.w.id] === 0) grade(it.w, !tr.missed.has(it.w.id), it.f === 'say' ? 2 : 0);
      if (ok) tr.right++;
    }
    if (!ok && it.w && !it.again) tr.items.push(Object.assign({}, it, { again: true, opts: null, shown: false, played: -1 }));   // once more at the end
    if (quiet) return;
    viewPractice();
    if (it.w && it.f !== 'gap') playWord(it.w);
    if (ok && it.f === 'pick') { const at = tr.i; setTimeout(() => { if (tr && tr.i === at && tr.res && location.hash === '#practice') nextItem(); }, 1100); }
  }
  function nextItem() { tr.i++; tr.res = null; viewPractice(); }
  function checkTyped(skip) {
    const it = tr.items[tr.i], a = $('#t-ans');
    if (!it || tr.res) return;
    const typed = skip ? '' : (a ? a.value : '');
    const n = x => fold(x).replace(/[\s\-.'’]/g, '');
    const target = it.f === 'fill' ? it.ans : it.w.en;
    settle(!skip && !!typed.trim() && n(typed) === n(target), { typed });
  }
  function practiceDone() {
    markDay();
    if (tr.lesson) { done.add(tr.lesson); store.set('sw.done', Array.from(done)); }
    let next = null;
    if (tr.lesson && C()) { const ls = C().lessons, i = ls.findIndex(l => l.id === tr.lesson); next = ls.slice(i + 1).find(l => !done.has(l.id)) || null; }
    const st = !tr.lesson && C() ? bestStory(tr.pool) : null;
    const line = tr.kind === 'first' ? pl(tr.pool.length, SL) + ' у вашому списку. Завтра — 2 хвилини повторення, і вони ваші.'
      : 'Слова повернуться на повторення завтра, потім через 3 дні, тиждень, два тижні — так вони залишаються в пам’яті.';
    $('#main').innerHTML = '<div class="train"><div class="hint">' + esc(tr.title) + '</div>' +
      '<h1 class="done-h">' + (tr.kind === 'daily' ? 'На сьогодні готово!' : 'Готово!') + '</h1>' +
      '<div class="score">' + tr.right + ' / ' + tr.first + '</div><div class="hint">правильно з першої спроби' + (tr.lesson ? ' · урок вивчено ✓' : '') + '</div>' +
      '<p class="lead c">' + line + '</p>' +
      '<div class="row">' + (next ? '<a class="btn primary" href="#lesson/' + next.id + '" lang="en">Наступний урок: ' + esc(next.title) + ' →</a>' : '') +
        (tr.lesson ? '' : '<button class="btn primary" id="more5">Ще 5 хвилин</button>') +
        (st ? '<a class="btn" href="#lesson/' + st.id + '">Прочитати історію: <span lang="en">' + esc(st.title) + '</span></a>' : '') +
        '<button class="btn" id="t-restart">Ще раз</button>' +
        (tr.lesson ? '<a class="btn" href="#lesson/' + tr.lesson + '">До уроку</a>' : '<a class="btn" href="#learn">На головну</a>') + '</div></div>';
  }

  // ---------- lesson extras: play all words, read the story aloud, a bubble for a story word
  let playAllTimer = null;
  function stopPlayAll() {
    if (playAllTimer) clearTimeout(playAllTimer);
    playAllTimer = null;
    document.querySelectorAll('.playing').forEach(x => x.classList.remove('playing'));
    const b = $('#play-all'); if (b) b.textContent = '▶ Послухати всі';
  }
  function playAll() {
    if (playAllTimer) { stopPlayAll(); return; }
    const ws = state.list.filter(canPlay);
    let i = 0;
    const b = $('#play-all'); if (b) b.textContent = '■ Зупинити';
    const step = () => {
      document.querySelectorAll('.playing').forEach(x => x.classList.remove('playing'));
      if (i >= ws.length) { stopPlayAll(); return; }
      const w = ws[i++];
      playWord(w);
      const el = Array.from(document.querySelectorAll('[data-id], [data-row]')).find(x => (x.dataset.id || x.dataset.row) === w.id);
      if (el) el.classList.add('playing');
      playAllTimer = setTimeout(step, ((w.au ? w.au[2] : 1) + 0.7) * 1000);
    };
    step();
  }
  function enVoice() {
    try { const vs = speechSynthesis.getVoices(); return vs.find(v => v.lang === 'en-US') || vs.find(v => /^en/.test(v.lang)) || null; } catch (e) { return null; }
  }
  function stopStory() {
    if (canSpeak) { try { speechSynthesis.cancel(); } catch (e) {} }
    document.querySelectorAll('.sent.on').forEach(x => x.classList.remove('on'));
    const b = $('#read-story'); if (b) { b.textContent = '▶ Слухати'; b.dataset.on = ''; }
  }
  function readStory(btn) {
    if (!canSpeak) return;
    if (btn.dataset.on) { stopStory(); return; }
    stopPlayAll();
    const ss = Array.from(document.querySelectorAll('#story .sent'));
    let i = 0;
    btn.dataset.on = '1'; btn.textContent = '■ Зупинити';
    const v = enVoice();
    const step = () => {
      document.querySelectorAll('.sent.on').forEach(x => x.classList.remove('on'));
      if (!btn.dataset.on || i >= ss.length) { stopStory(); return; }
      const el = ss[i++];
      el.classList.add('on');
      const u = new SpeechSynthesisUtterance(el.textContent.replace(/^\s*[A-Z][a-z]+:\s*/, ''));
      u.lang = 'en-US'; u.rate = .88; if (v) u.voice = v;
      u.onend = step; u.onerror = stopStory;
      speechSynthesis.speak(u);
    };
    try { speechSynthesis.cancel(); } catch (e) {}
    step();
  }
  function closeBubble() { const b = $('#bubble'); if (b) b.remove(); }
  function storyWord(en, el) {   // a word in the story: say it and show it in a bubble
    const w = BY_EN.get(en); if (!w) return;
    playWord(w);
    closeBubble();
    if (!el) return;
    const on = mine.has(w.id);
    const b = document.createElement('div');
    b.className = 'bubble'; b.id = 'bubble'; b.setAttribute('role', 'dialog');
    b.innerHTML = '<span class="b-en" lang="en">' + stressed(w) + '</span><span class="b-eq">' + (w.sim ? '≈' : '=') + '</span><span class="b-uk" lang="uk">' + esc(w.uk) + '</span>' +
      (canPlay(w) ? '<button class="icon" data-sayid="' + esc(w.id) + '" aria-label="Вимова: ' + esc(w.en) + '">' + SAY + '</button>' : '') +
      '<button class="icon add' + (on ? ' on' : '') + '" data-add="' + esc(w.id) + '" aria-label="' + (on ? 'Прибрати з моїх слів' : 'Додати до моїх слів') + '">' + (on ? CHECK : PLUS) + '</button>' +
      ukStressLine(w);
    document.body.appendChild(b);
    const r = el.getBoundingClientRect(), bw = b.offsetWidth;
    b.style.left = Math.max(8, Math.min(window.scrollX + r.left - 10, window.scrollX + document.documentElement.clientWidth - bw - 8)) + 'px';
    b.style.top = (window.scrollY + r.bottom + 8) + 'px';
  }

  // ---------- routing
  function route() {
    let h = decodeURIComponent((location.hash || '').slice(1));
    if (BANDS.indexOf(h.toLowerCase()) >= 0) { state.band = h.toLowerCase(); state.topic = ''; h = 'words'; }   // older links: #top-1000
    if (h === 'stories' || /^story-/.test(h) || !h) h = 'learn';
    if (h === 'train') h = 'practice';
    const [r, arg] = h.split('/');
    state.route = r; state.arg = arg || '';
    stopPlayAll(); stopStory(); closeBubble();
    document.querySelectorAll('.menu a').forEach(a => a.setAttribute('aria-current',
      a.dataset.nav === (r === 'level' || r === 'lesson' || r === 'ex' || r === 'careful' || r === 'start' ? 'learn' : r) ? 'page' : 'false'));
    renderMineCount();
    const needCourse = r === 'learn' || r === 'level' || r === 'lesson' || r === 'ex' || r === 'practice';
    if (needCourse && !C()) {
      $('#main').innerHTML = '<div class="blank">Завантаження…</div>';
      loadCourse().then(route).catch(() => { $('#main').innerHTML = '<div class="blank">Не вдалося завантажити уроки. <a href="#words">Усі слова</a></div>'; });
      return;
    }
    if (r === 'start') { startFirst(); return; }
    if (r === 'daily') { startDaily(); return; }
    if (r === 'level') viewLevel(state.arg);
    else if (r === 'careful') viewCareful();
    else if (r === 'lesson') viewLesson(state.arg);
    else if (r === 'ex') viewExclamations();
    else if (r === 'words') viewWords();
    else if (r === 'mine') viewMine();
    else if (r === 'practice') viewPractice();
    else viewLearn();
    window.scrollTo(0, 0);
  }
  function renderMineCount() { const n = mine.size; $('#mine-n').textContent = n ? n : ''; }

  // ---------- events
  let swiped = false;
  document.addEventListener('click', e => {
    if (swiped) { swiped = false; return; }
    if (!e.target.closest('#bubble') && !e.target.closest('.sw')) closeBubble();
    const sw = e.target.closest('.sw');
    if (sw) { storyWord(sw.dataset.sw, sw); return; }
    const row = e.target.closest('.rw');
    if (row && !e.target.closest('button')) { toggleRow(row); return; }
    const t = e.target.closest('button, .card');
    if (!t) return;
    if (t.dataset.demo) { const d = $('#demo-after'); if (d) d.hidden = false; }
    if (t.dataset.sayid) { e.stopPropagation(); playWord(BY_ID.get(t.dataset.sayid), t); return; }
    if (t.dataset.speak) { e.stopPropagation(); speak(t.dataset.speak); return; }
    if (t.dataset.add) {
      e.stopPropagation();
      const id = t.dataset.add;
      mine.has(id) ? mine.delete(id) : mine.add(id);
      store.set('sw.mine', Array.from(mine));
      if (state.route === 'mine' && !mine.has(id)) { viewMine(); renderMineCount(); return; }
      t.classList.toggle('on', mine.has(id)); t.innerHTML = mine.has(id) ? CHECK : PLUS;
      t.setAttribute('aria-label', mine.has(id) ? 'Прибрати з моїх слів' : 'Додати до моїх слів');
      renderMineCount(); return;
    }
    if (t.dataset.view) {
      state.view = t.dataset.view; store.set('sw.view', state.view);
      document.querySelectorAll('.seg button[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === state.view));
      state.idx = 0; showCards(state.list); return;
    }
    if (t.dataset.collect) { state.kind = t.dataset.collect; state.band = ''; state.topic = ''; state.q = ''; location.hash = 'words'; return; }
    if (t.dataset.sec) { const s = document.getElementById('sec-' + t.dataset.sec); if (s) s.scrollIntoView({ behavior: 'smooth' }); return; }
    if (t.id === 'show-more') { appendCards(); return; }
    if (t.id === 'prev') { move(-1); return; }
    if (t.id === 'next') { move(1); return; }
    if (t.id === 'play-all') { playAll(); return; }
    if (t.id === 'read-story') { readStory(t); return; }
    if (t.id === 'daily') { startDaily(); return; }
    if (t.id === 'more5') { startDaily(true); return; }
    if (t.id === 'practice') {
      if (state.route === 'lesson') { const f = findLesson(state.arg); if (f) startSession(itemsFor(state.list, true), f.l.title, { lesson: f.l.level ? f.l.id : '' }); }
      else startSession(itemsFor(state.list), 'Мої слова');
      return;
    }
    if (t.classList.contains('card') && !t.closest('.train')) {
      if (String(window.getSelection ? getSelection() : '')) return;   // selecting text should not flip
      flip(t); return;
    }
    if (!tr) return;
    const it = tr.items[tr.i];
    if (t.dataset.pmode) {
      state.pmode = t.dataset.pmode; store.set('sw.pmode2', state.pmode);
      startSession(state.pmode === 'mix' && tr.kind === 'first' ? tr.orig : itemsFor(tr.pool, !!tr.lesson), tr.title, { lesson: tr.lesson, kind: tr.kind });
      return;
    }
    if (t.dataset.opt != null && it && !tr.res) {
      const k = +t.dataset.opt;
      if (it.f === 'pick') settle(it.opts[k] === it.w, { pick: it.opts[k] });
      else if (it.f === 'gap') settle(it.opts[k] === it.ans, { pick: it.opts[k] });
      return;
    }
    if (t.dataset.syl != null && it && !tr.res) { const k = +t.dataset.syl; settle(k === sylls(it.w).k, { pick: k }); return; }
    if (t.id === 't-check') { checkTyped(false); return; }
    if (t.id === 't-skip') { checkTyped(true); return; }
    if (t.id === 't-next') { nextItem(); return; }
    if (t.id === 't-show' && it) { it.shown = true; viewPractice(); playWord(it.w); return; }
    if ((t.id === 't-know' || t.id === 't-again') && it) { settle(t.id === 't-know', null, true); nextItem(); return; }
    if (t.id === 't-restart') { startSession(tr.orig.map(x => Object.assign({}, x, { opts: null, shown: false, played: -1 })), tr.title, { lesson: tr.lesson, kind: tr.kind }); return; }
  });
  let qTimer = null;
  document.addEventListener('input', e => {
    if (e.target.id === 'q') { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value; refreshWords(); }, 120); }
  });
  document.addEventListener('change', e => {
    const id = e.target.id;
    if (id === 'f-band') { state.band = e.target.value; refreshWords(); }
    else if (id === 'f-topic') { state.topic = e.target.value; refreshWords(); }
    else if (id === 'f-kind') { state.kind = e.target.value; refreshWords(); }
    else if (id === 'f-ns') { state.hideNs = e.target.checked; store.set('sw.hideNs2', state.hideNs); refreshWords(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeBubble();
    if (e.target.id === 't-ans' && e.key === 'Enter') { e.preventDefault(); checkTyped(false); return; }
    if (e.target.closest && e.target.closest('input, textarea, select')) return;
    if (state.route === 'practice' && tr) {
      const it = tr.items[tr.i];
      if (tr.res || (it && it.f === 'info')) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); nextItem(); } return; }
      if (!it) return;
      if (/^[1-9]$/.test(e.key)) {
        const b = document.querySelector('[data-opt="' + (e.key - 1) + '"], [data-syl="' + (e.key - 1) + '"]');
        if (b) { e.preventDefault(); b.click(); }
        return;
      }
      if (it.f === 'say') {
        if ((e.key === ' ' || e.key === 'Enter') && !it.shown) { e.preventDefault(); $('#t-show').click(); }
        else if (it.shown && (e.key === 'ArrowLeft')) $('#t-again').click();
        else if (it.shown && (e.key === 'ArrowRight' || e.key === 'Enter')) $('#t-know').click();
      }
      return;
    }
    const a = document.activeElement;
    if ((e.key === 'Enter' || e.key === ' ') && a && a.classList && a.classList.contains('sw')) { e.preventDefault(); storyWord(a.dataset.sw, a); return; }
    if ((e.key === 'Enter' || e.key === ' ') && a && a.classList && a.classList.contains('rw')) { e.preventDefault(); toggleRow(a); return; }
    if (e.key === 'ArrowRight' && state.view === 'single' && $('.single')) move(1);
    else if (e.key === 'ArrowLeft' && state.view === 'single' && $('.single')) move(-1);
    else if (e.key === ' ' || e.key === 'Enter') {
      if (a && a.tagName === 'BUTTON') return;
      const card = a && a.classList && a.classList.contains('card') ? a
        : (state.view === 'single' && (!a || a === document.body) ? document.querySelector('.single .card') : null);
      if (card) { e.preventDefault(); flip(card); }
    }
  });
  let sx = null;   // swipe left/right in One by one view
  document.addEventListener('pointerdown', e => { sx = e.target.closest && e.target.closest('.single .card') ? [e.clientX, e.clientY] : null; });
  document.addEventListener('pointerup', e => {
    if (!sx) return;
    const dx = e.clientX - sx[0], dy = e.clientY - sx[1];
    sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > 1.5 * Math.abs(dy)) { swiped = true; move(dx < 0 ? 1 : -1); setTimeout(() => { swiped = false; }, 400); }
  });
  window.addEventListener('hashchange', route);
  if (canSpeak) { try { speechSynthesis.getVoices(); } catch (e) {} }
  route();
})();
</script>
</body>
</html>
