<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Same Words</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Same Words. Layout: a lesson page, not a catalog. Home is one Continue button. A cloud (one situation) is a row of
   screens: one thing per screen, the big line in the middle, Back and Next at the bottom, no page scrolling. */
:root {
  --bg: #F3F5F8; --card: #FFFFFF; --ink: #15202B; --muted: #5C6977; --line: #DCE2E9; --sunk: #EAEEF3;
  --green: #0B7A55; --green-soft: #DDF3E9; --pink: #B0195A; --pink-soft: #FCE6EF; --blue: #1B58C4; --blue-soft: #E4ECFB;
  --yellow: #FFF0B8; --yellow-ink: #4E3F00; --red: #B3261E; --red-soft: #FBE7E5; --on-green: #FFFFFF;
  --font: "Lexend", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 14px rgba(16, 24, 40, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F141A; --card: #182029; --ink: #E9EEF3; --muted: #9BA7B4; --line: #2A3542; --sunk: #202A35;
    --green: #56D3A2; --green-soft: #143328; --pink: #FF8FBC; --pink-soft: #3A1A28; --blue: #8DB4FF; --blue-soft: #18284A;
    --yellow: #4A3F12; --yellow-ink: #FFE99A; --red: #FF8A80; --red-soft: #3B1D1B; --on-green: #06231A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F141A; --card: #182029; --ink: #E9EEF3; --muted: #9BA7B4; --line: #2A3542; --sunk: #202A35;
  --green: #56D3A2; --green-soft: #143328; --pink: #FF8FBC; --pink-soft: #3A1A28; --blue: #8DB4FF; --blue-soft: #18284A;
  --yellow: #4A3F12; --yellow-ink: #FFE99A; --red: #FF8A80; --red-soft: #3B1D1B; --on-green: #06231A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; min-height: 100dvh; }
a { color: var(--green); text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 2.5px solid var(--blue); outline-offset: 2px; border-radius: 8px; }

/* top bar: three places */
.bar { background: var(--card); border-bottom: 1px solid var(--line); flex: none; }
.bar-in { max-width: 980px; margin: 0 auto; padding: 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 10px; }
.brand { font-weight: 700; font-size: 18px; color: var(--ink); margin-right: auto; white-space: nowrap; letter-spacing: -.01em; }
.brand i { font-style: normal; color: var(--green); }
.nav { display: flex; gap: 2px; }
.nav a { padding: 7px 12px; border-radius: 999px; color: var(--muted); font-weight: 500; font-size: 15px; white-space: nowrap; }
.nav a[aria-current="page"] { background: var(--green-soft); color: var(--green); }
body.lesson .bar { display: none; }

main { flex: 1 1 auto; width: 100%; max-width: 980px; margin: 0 auto; padding: 22px max(16px, env(safe-area-inset-left, 0px)) 40px; }
body.lesson main { max-width: 760px; padding: 0 max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; min-height: 0; height: 100dvh; }
h1 { font-size: clamp(28px, 6vw, 40px); line-height: 1.12; letter-spacing: -.02em; margin: 0; font-weight: 700; text-wrap: balance; }
h2 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
.eyebrow { font-size: 12.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--green); margin-bottom: 8px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.ua { background: var(--yellow); color: var(--yellow-ink); border-radius: 8px; padding: 1px 8px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 20px; border-radius: 14px;
  border: 1.5px solid var(--line); background: var(--card); font-weight: 600; font-size: 16px; color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn.go { background: var(--green); border-color: var(--green); color: var(--on-green); }
.btn.go:hover { filter: brightness(1.06); border-color: var(--green); }
.btn.big { min-height: 58px; padding: 14px 34px; font-size: 19px; border-radius: 18px; }
.say { flex: none; width: 44px; height: 44px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--green-soft); color: var(--green); }
.say svg { width: 22px; height: 22px; }
.say.busy svg { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

/* home: one panel, one button */
.home { background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: clamp(20px, 4vw, 36px); }
.home .where { color: var(--muted); font-size: 15px; margin: 8px 0 0; }
.home .what { font-size: 17px; margin: 18px 0 0; max-width: 46ch; }
.home .go-row { display: flex; align-items: center; gap: 14px 18px; flex-wrap: wrap; margin-top: 22px; }
.teaser { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 0; }
.prog { margin-top: 22px; }
.prog .track { height: 6px; border-radius: 6px; background: var(--sunk); overflow: hidden; }
.prog .track i { display: block; height: 100%; background: var(--green); border-radius: 6px; }
.prog .txt { color: var(--muted); font-size: 14px; margin-top: 8px; }
.links { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 22px 2px 0; font-size: 15px; font-weight: 500; }

/* a word of a cloud: tap to hear */
.chip { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 0; text-align: left; padding: 8px 14px; border-radius: 14px;
  background: var(--card); border: 1.5px solid var(--line); min-width: 0; line-height: 1.25; }
.chip b { font-weight: 600; font-size: 18px; overflow-wrap: anywhere; }
.chip span { font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; }
.chip:hover { border-color: var(--green); }
.chip.on { background: var(--green-soft); border-color: var(--green); }
.st { color: var(--green); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }

/* the map of clouds */
.circle { margin-top: 30px; }
.circle p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 10px; }
.tile { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 2px 10px; align-items: center; padding: 12px 14px; background: var(--card);
  border: 1.5px solid var(--line); border-radius: 16px; color: inherit; }
.tile:hover { border-color: var(--green); }
.tile .e { grid-row: 1 / span 2; font-size: 28px; line-height: 1; text-align: center; }
.tile b { font-weight: 600; font-size: 15.5px; line-height: 1.25; }
.tile > span:last-child { color: var(--muted); font-size: 13px; }
.tile.done { background: var(--green-soft); border-color: transparent; }
.tile.done > span:last-child::after { content: " · ✓"; color: var(--green); font-weight: 600; }
.tile.next { border-color: var(--green); }

/* a cloud lesson: tabs, dots, one card, two buttons */
.ltop { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 0 6px; }
.x { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); font-size: 24px; line-height: 1; }
.x:hover { background: var(--sunk); color: var(--ink); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; -webkit-overflow-scrolling: touch; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; padding: 7px 12px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.dots { flex: none; display: flex; gap: 5px; justify-content: center; padding: 4px 0 10px; min-height: 18px; }
.dots i { width: 7px; height: 7px; border-radius: 7px; background: var(--line); transition: width .15s; }
.dots i.on { width: 22px; background: var(--green); }
.card { flex: 1 1 auto; min-height: 0; background: var(--card); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; padding: 18px clamp(14px, 4vw, 30px) 20px; overflow-y: auto; text-align: center; }
.label { flex: none; align-self: center; font-size: 14px; font-weight: 600; padding: 5px 14px; border-radius: 999px; background: var(--sunk); color: var(--muted); margin-bottom: 8px; }
.label.pink { background: var(--pink-soft); color: var(--pink); }
.label.blue { background: var(--blue-soft); color: var(--blue); }
.label.green { background: var(--green-soft); color: var(--green); }
.label.red { background: var(--red-soft); color: var(--red); }
.mid { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; width: 100%; min-height: 0; }
.bigline { font-weight: 700; font-size: clamp(26px, 6.4vw, 44px); line-height: 1.18; letter-spacing: -.015em; text-wrap: balance; max-width: 20ch; }
.bigline.long { font-size: clamp(22px, 5vw, 34px); max-width: 26ch; }
.bigline.uk { font-weight: 600; }
.sub { color: var(--muted); font-size: 17px; max-width: 34ch; text-wrap: balance; }
.hintline { color: var(--muted); font-size: 14.5px; min-height: 22px; max-width: 44ch; }
.foot { flex: none; display: flex; gap: 10px; padding: 12px 0 max(14px, env(safe-area-inset-bottom, 0px)); }
.foot .btn { flex: 1; }
.foot .btn.back { flex: 0 0 auto; padding-inline: 18px; color: var(--muted); }

/* the cloud screen */
.cloud { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: 100%; align-content: center; }
@media (min-width: 620px) { .cloud { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; } }
.cloud .chip { width: 100%; }
@media (max-height: 720px) { .cloud { gap: 5px; } .cloud .chip { padding: 3px 12px; } .cloud .chip b { font-size: 16px; } .cloud .chip span { font-size: 12.5px; }
  .card { padding-top: 10px; padding-bottom: 10px; } .mid { gap: 6px; } .label { margin-bottom: 4px; } .more-btn { padding: 2px 10px; } .dots { padding-bottom: 6px; } }
.more-btn { color: var(--green); font-weight: 600; font-size: 15px; padding: 6px 10px; }
.cloud.more .chip b { font-size: 16px; font-weight: 500; }

/* dialogue and the summary list */
.lines { width: 100%; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.ln { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 12px; border-radius: 16px; background: var(--sunk); }
.ln.you { background: var(--green-soft); }
.ln.hear { background: var(--blue-soft); }
.ln.hear .say { background: var(--card); color: var(--blue); }
.ln .say { background: var(--card); }
.ln .who { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.ln b { display: block; font-weight: 600; font-size: 18px; line-height: 1.3; }
.ln .tr { display: block; font-size: 14.5px; color: var(--muted); margin-top: 2px; }
.ln.playing { outline: 2px solid var(--green); }
.row2 { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn.sm { min-height: 40px; padding: 6px 14px; font-size: 14.5px; border-radius: 12px; }
.mine { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.mine input { width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.mine input:focus { outline: none; border-color: var(--green); }
.wordhints { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.wordhints span { font-size: 13.5px; padding: 2px 10px; border-radius: 999px; background: var(--sunk); color: var(--muted); }

/* search: the whole list */
.search { width: 100%; padding: 14px 16px; font: inherit; font-size: 17px; color: var(--ink); border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); margin: 14px 0 6px; }
.search:focus { outline: none; border-color: var(--green); }
.rows { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; margin-top: 10px; }
.rw { display: grid; grid-template-columns: 40px minmax(0, 1fr) 18px minmax(0, 1fr); align-items: center; gap: 8px; padding: 5px 12px 5px 8px; border-top: 1px solid var(--line); cursor: pointer; }
.rw:first-child { border-top: 0; }
.rw .say { width: 38px; height: 38px; background: none; }
.rw .r-en { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.rw .r-uk { color: var(--muted); font-size: 16px; overflow-wrap: anywhere; }
.rw .r-eq { color: var(--muted); text-align: center; }
.rw.open { background: var(--green-soft); }
.rw-more { padding: 2px 16px 14px 58px; background: var(--green-soft); font-size: 15px; }
.rw-more ol { margin: 6px 0 0; padding-left: 20px; }
.rw-more .note { color: var(--muted); font-size: 14px; margin-top: 6px; }
.rw-more a { font-weight: 600; }
.more { display: flex; justify-content: center; padding: 14px 0 0; }
.count { color: var(--muted); font-size: 14px; }

/* look-alikes, my sentences */
.ffs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 10px; margin-top: 16px; }
.ffc { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.ffc b { display: block; font-size: 18px; font-weight: 600; }
.ffc p { margin: 4px 0 6px; color: var(--muted); font-size: 15px; }
.ffc a { font-size: 13px; font-weight: 500; }
.mysent { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-top: 10px; }
.mysent ul { margin: 6px 0 0; padding-left: 20px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-say" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
</defs></svg>
<header class="bar"><div class="bar-in">
  <a class="brand" href="#today">Same <i>Words</i></a>
  <nav class="nav" aria-label="Sections">
    <a href="#today" data-nav="today">Today</a>
    <a href="#clouds" data-nav="clouds">Clouds</a>
    <a href="#search" data-nav="search">Search</a>
  </nav>
</div></header>
<main id="main"></main>

<script src="clouds.js"></script>
<script>
(function () {
  'use strict';
  const CL = window.CLOUDS || { circles: [] };
  const ALL = [];
  CL.circles.forEach(ci => ci.clouds.forEach(c => { c.circle = ci; ALL.push(c); }));
  const BY = new Map(ALL.map(c => [c.id, c]));
  const PATH = ALL.filter(c => c.circle.id !== 'S');          // the Continue path; reactions and slang stay on the side
  const $ = s => document.querySelector(s);
  const main = $('#main');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 6e4) / 864e5);
  const done = store.get('sw2.done', {});      // cloud id -> day it was finished
  const pos = store.get('sw2.pos', {});        // cloud id -> screen to come back to
  const mine = store.get('sw2.mine', {});      // cloud id -> the student's own sentences
  const reps = store.get('sw2.rep', {});       // cloud id -> day its phrases were last repeated
  const SAY = '<svg aria-hidden="true"><use href="#i-say"/></svg>';
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  const nextCloud = () => PATH.find(c => !done[c.id]) || null;
  const wordsDone = () => ALL.filter(c => done[c.id]).reduce((n, c) => n + c.w.length, 0);
  const state = { c: null, screens: [], i: 0, shown: {}, more: false, tr: false, teaser: null };

  // ---------- sound: one recorded file per cloud; the browser voice only as a fallback
  const canSpeak = 'speechSynthesis' in window;
  let actx = null, playing = null, seq = 0;
  const bufs = {}, els = {};
  function speak(text) {
    if (!canSpeak) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = .92;
      const v = speechSynthesis.getVoices().find(v => v.lang === 'en-US') || speechSynthesis.getVoices().find(v => /^en/.test(v.lang));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function ctx() {
    if (!actx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try { actx = new C({ sampleRate: 24000 }); } catch (e) { actx = new C(); }
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    }
    return actx;
  }
  function loadBuf(url) {
    if (!bufs[url]) {
      bufs[url] = fetch(url).then(r => { if (!r.ok) throw new Error('audio ' + r.status); return r.arrayBuffer(); })
        .then(b => new Promise((res, rej) => ctx().decodeAudioData(b, res, rej)));
      bufs[url].catch(() => { delete bufs[url]; });
    }
    return bufs[url];
  }
  function stopSound() {
    seq++;
    if (playing) { try { playing.stop(); } catch (e) {} playing = null; }
    Object.keys(els).forEach(k => { try { els[k].pause(); } catch (e) {} });
    if (canSpeak) { try { speechSynthesis.cancel(); } catch (e) {} }
  }
  function viaElement(url, start, dur, text) {     // also works when the page is opened from disk
    const a = els[url] || (els[url] = new Audio(url));
    try { a.pause(); a.currentTime = Math.max(0, start - .04); } catch (e) {}
    clearTimeout(a._t);
    return a.play().then(() => new Promise(res => { a._t = setTimeout(() => { a.pause(); res(); }, (dur + .12) * 1000); }))
      .catch(() => { speak(text); return new Promise(res => setTimeout(res, 600 + text.length * 70)); });
  }
  function playSeg(url, start, dur, text, btn) {    // resolves when the clip ends
    stopSound();
    const my = seq;
    const c = location.protocol === 'file:' ? null : ctx();
    if (!c) return viaElement(url, start, dur, text);
    if (c.state === 'suspended') c.resume();
    if (btn) btn.classList.add('busy');
    const fin = () => { if (btn) btn.classList.remove('busy'); };
    return loadBuf(url).then(buf => new Promise(res => {
      fin();
      if (my !== seq) return res();
      const src = c.createBufferSource();
      src.buffer = buf; src.connect(c.destination);
      src.onended = res;
      src.start(0, Math.max(0, start - .04), dur + .1);
      playing = src;
    })).catch(() => { fin(); return my === seq ? viaElement(url, start, dur, text) : null; });
  }
  function sayIn(c, text, btn) {       // a word or a phrase of a cloud
    const a = c && c.au && c.au[text];
    if (a) return playSeg('audio/cloud-' + c.id + '.mp3', a[0], a[1], text, btn);
    stopSound(); speak(text);
    return new Promise(res => setTimeout(res, 600 + text.length * 70));
  }
  const clean = s => String(s).replace(/^[AB]:\s*/, '');
  function stressed(w) {
    if (!w.st) return esc(w.en);
    return esc(w.en.slice(0, w.st[0])) + '<span class="st">' + esc(w.en.slice(w.st[0], w.st[1])) + '</span>' + esc(w.en.slice(w.st[1]));
  }
  const chip = (w, i) => '<button class="chip" data-w="' + i + '" lang="en"><b>' + stressed(w) + '</b><span lang="uk">' + esc(w.uk) + '</span></button>';

  // ---------- Today: one panel, one button
  function viewToday() {
    const c = nextCloud(), nDone = PATH.filter(x => done[x.id]).length, first = !Object.keys(done).length;
    if (!c) {
      main.innerHTML = '<section class="home"><div class="eyebrow">All clouds done</div><h1>You know all ' + PATH.length + ' clouds.</h1>' +
        '<p class="what">Open any cloud again from the list, or search all the words.</p>' +
        '<div class="go-row"><a class="btn go big" href="#clouds">All clouds</a></div></section>';
      return;
    }
    const n = PATH.indexOf(c) + 1;
    state.teaser = c;
    main.innerHTML = '<section class="home">' +
      '<div class="eyebrow">' + (first ? 'English words you already know' : 'Next cloud') + '</div>' +
      '<h1>' + esc(c.e) + ' ' + esc(c.en) + '</h1>' +
      '<p class="where"><span lang="uk">' + esc(c.uk) + '</span> · cloud ' + n + ' of ' + PATH.length + '</p>' +
      '<div class="teaser">' + c.w.slice(0, 10).map((w, i) => chip(w, i)).join('') + '</div>' +
      '<p class="what">' + (first ? 'You say these words in Ukrainian every day. They are English words, too. Tap one to hear it.'
        : plural(c.w.length, 'word') + ' you know from Ukrainian, ' + plural(c.s.length, 'phrase') + ' to say' + (c.d.length ? ', one dialogue' : '') + '.') + '</p>' +
      '<div class="go-row"><a class="btn go big" href="#c/' + c.id + '">' + (first ? 'Start' : 'Continue') + '</a>' +
        '<span class="muted small">About 5 minutes. No sign-up.</span></div>' +
      '<div class="prog"><div class="track"><i style="width:' + Math.round(100 * nDone / PATH.length) + '%"></i></div>' +
        '<div class="txt">' + (nDone ? plural(nDone, 'cloud') + ' done · ' + plural(wordsDone(), 'word') + ' you can use'
          : 'One cloud is one situation: the café, the doctor, the office.') + '</div></div>' +
      '</section>' +
      '<div class="links"><a href="#clouds">All ' + ALL.length + ' clouds</a><a href="#search">Search all words</a><a href="#careful">Look-alikes to watch</a>' +
        (Object.keys(mine).length ? '<a href="#mine">My sentences</a>' : '') + '</div>';
  }

  // ---------- Clouds: the map
  function viewClouds() {
    const nx = nextCloud();
    main.innerHTML = '<h1>Clouds</h1><p class="muted" style="margin:8px 0 0;max-width:60ch">One cloud is one situation and the words you already know for it. ' +
      'They go from what you need every day to what you need less often.</p>' +
      CL.circles.map(ci => '<section class="circle"><h2>' + esc(ci.en) + '</h2><p lang="uk">' + esc(ci.uk) + '</p><div class="tiles">' +
        ci.clouds.map(c => '<a class="tile' + (done[c.id] ? ' done' : '') + (nx === c ? ' next' : '') + '" href="#c/' + c.id + '"><span class="e">' + esc(c.e) + '</span>' +
          '<b>' + esc(c.en) + '</b><span><span lang="uk">' + esc(c.uk) + '</span> · ' + (c.w.length + c.m.length) + '</span></a>').join('') +
        '</div></section>').join('') +
      '<section class="circle"><h2>Look-alikes to watch</h2><p lang="uk">Схожі слова, які означають інше</p><div class="tiles">' +
        '<a class="tile" href="#careful"><span class="e">⚠️</span><b>Careful!</b><span>magazine ≠ магазин</span></a></div></section>';
  }

  // ---------- a cloud lesson
  function repeatItems(c) {      // three phrases from clouds finished before: the ones not repeated for the longest time first
    const old = ALL.filter(x => done[x.id] && x !== c && x.s.length);
    old.sort((a, b) => Math.max(done[a.id], reps[a.id] || 0) - Math.max(done[b.id], reps[b.id] || 0));
    return old.slice(0, 3).map(x => {
      const list = x.id.indexOf('r-') === 0 ? x.s.slice(1) : x.s;
      return { from: x, s: list[Math.floor(Math.random() * list.length)] };
    });
  }
  function screensFor(c) {
    const S = [], rule = c.id.indexOf('r-') === 0 ? c.s[0] : null;
    repeatItems(c).forEach(r => S.push({ part: 'Repeat', t: 'say', en: r.s[0], uk: r.s[1], from: r.from }));
    if (rule) S.push({ part: 'Rule', t: 'rule', en: rule[0], uk: rule[1] });
    S.push({ part: 'Words', t: 'cloud' });
    (rule ? c.s.slice(1) : c.s).forEach(s => S.push({ part: 'Say it', t: 'say', en: s[0], uk: s[1] }));
    if (c.d.length) S.push({ part: 'Dialogue', t: 'dialogue' });
    c.x.forEach(x => S.push({ part: 'Careful', t: 'careful', title: x[0], text: x[1] }));
    S.push({ part: 'All together', t: 'all' });
    S.push({ part: 'This week', t: 'mine' });
    return S;
  }
  function openCloud(id) {
    const c = BY.get(id);
    if (!c) { location.hash = 'clouds'; return; }
    state.c = c; state.screens = screensFor(c); state.shown = {}; state.more = false; state.tr = false;
    const p = pos[c.id];      // come back to the same part of the cloud (the Repeat cards are new each time)
    state.i = p && !done[c.id] ? Math.max(0, state.screens.findIndex(s => s.part === p)) : 0;
    renderScreen();
  }
  function renderScreen() {
    const c = state.c, S = state.screens, i = state.i, sc = S[i];
    const parts = []; S.forEach(x => { if (parts.indexOf(x.part) < 0) parts.push(x.part); });
    const inPart = S.filter(x => x.part === sc.part), k = inPart.indexOf(sc);
    const last = i === S.length - 1, nextPart = !last && S[i + 1].part !== sc.part ? S[i + 1].part : '';
    let label = '', cls = '', body = '';
    if (sc.t === 'cloud') {
      const list = state.more ? c.m : c.w;
      label = state.more ? '➕ More words you know' : '☁️ ' + plural(c.w.length, 'word') + ' you already know'; cls = 'green';
      body = '<div class="mid"><div class="cloud' + (state.more ? ' more' : '') + '">' + list.map((w, j) => chip(w, j)).join('') + '</div>' +
        '<div class="hintline" id="hint">Tap a word to hear it.</div>' +
        (c.m.length ? '<button class="more-btn" id="more">' + (state.more ? '← The main words' : '+ ' + c.m.length + ' more words') + '</button>' : '') + '</div>';
    } else if (sc.t === 'say') {
      const shown = !!state.shown[i];
      label = sc.from ? '🧠 Say it in English · ' + sc.from.en : '🧠 Say it in English'; cls = 'pink';
      body = '<div class="mid">' + (shown
        ? '<div class="sub"><span class="ua" lang="uk">' + esc(sc.uk) + '</span></div><div class="bigline' + (sc.en.length > 34 ? ' long' : '') + '" lang="en">' + esc(sc.en) + '</div>' +
          '<button class="say" data-say="' + esc(sc.en) + '" aria-label="Listen">' + SAY + '</button>'
        : '<div class="bigline uk' + (sc.uk.length > 34 ? ' long' : '') + '" lang="uk">' + esc(sc.uk) + '</div><div class="sub">Say it aloud, then check.</div>') + '</div>';
    } else if (sc.t === 'rule') {
      label = '📌 Rule'; cls = 'blue';
      body = '<div class="mid"><div class="bigline">' + esc(c.en) + '</div><div class="sub" lang="en" style="color:var(--ink)">' + esc(sc.en) + '</div>' +
        '<div class="sub"><span class="ua" lang="uk">' + esc(sc.uk) + '</span></div></div>';
    } else if (sc.t === 'dialogue') {
      label = '💬 Dialogue'; cls = 'blue';
      body = '<div class="mid"><div class="lines">' + c.d.map((d, j) => {
        const you = /^B:/.test(d[0]);
        return '<div class="ln ' + (you ? 'you' : 'hear') + '" data-ln="' + j + '"><button class="say" data-say="' + esc(clean(d[0])) + '" aria-label="Listen">' + SAY + '</button>' +
          '<div><span class="who">' + (you ? '💬 You say' : '👂 You hear') + '</span><b lang="en">' + esc(clean(d[0])) + '</b>' +
          (state.tr ? '<span class="tr" lang="uk">' + esc(d[1]) + '</span>' : '') + '</div></div>';
      }).join('') + '</div><div class="row2"><button class="btn sm" id="playall">▶ Play all</button>' +
        '<button class="btn sm" id="tr">' + (state.tr ? 'Hide' : 'Переклад') + '</button></div></div>';
    } else if (sc.t === 'careful') {
      label = '⚠️ Careful'; cls = 'red';
      body = '<div class="mid"><div class="bigline' + (sc.title.length > 22 ? ' long' : '') + '">' + esc(sc.title) + '</div>' +
        '<div class="sub" lang="uk" style="font-size:18px;color:var(--ink);max-width:36ch">' + esc(sc.text) + '</div></div>';
    } else if (sc.t === 'all') {
      const list = c.id.indexOf('r-') === 0 ? c.s.slice(1) : c.s;
      label = '✅ All together'; cls = 'green';
      body = '<div class="mid" style="justify-content:flex-start"><div class="lines">' + list.map(s =>
        '<div class="ln"><button class="say" data-say="' + esc(s[0]) + '" aria-label="Listen">' + SAY + '</button><div><b lang="en">' + esc(s[0]) + '</b>' +
        '<span class="tr" lang="uk">' + esc(s[1]) + '</span></div></div>').join('') + '</div></div>';
    } else {
      const m = mine[c.id] || [];
      label = '✍️ This week'; cls = 'green';
      body = '<div class="mid"><div class="bigline long">3 sentences I will use this week</div>' +
        '<div class="wordhints">' + c.w.slice(0, 8).map(w => '<span lang="en">' + esc(w.en) + '</span>').join('') + '</div>' +
        '<div class="mine">' + [0, 1, 2].map(j => '<input type="text" data-mine="' + j + '" lang="en" autocomplete="off" placeholder="' + (j + 1) + '." value="' + esc(m[j] || '') + '">').join('') + '</div></div>';
    }
    const needAnswer = sc.t === 'say' && !state.shown[i];
    document.body.classList.add('lesson');
    main.innerHTML =
      '<div class="ltop"><a class="x" href="#today" aria-label="Close">×</a><div class="tabs" role="tablist">' +
        parts.map(p => '<button class="tab" role="tab" data-part="' + esc(p) + '" aria-selected="' + (p === sc.part) + '">' + esc(p) + '</button>').join('') + '</div></div>' +
      '<div class="dots" aria-hidden="true">' + (inPart.length > 1 ? inPart.map((x, j) => '<i' + (j === k ? ' class="on"' : '') + '></i>').join('') : '') + '</div>' +
      '<section class="card"><span class="label ' + cls + '">' + esc(label) + '</span>' + body + '</section>' +
      '<div class="foot">' + (i > 0 ? '<button class="btn back" id="back" aria-label="Back">←</button>' : '') +
        (needAnswer ? '<button class="btn go" id="answer">Answer</button>'
          : last ? '<button class="btn go" id="finish">Done ✓</button>'
          : '<button class="btn go" id="next">' + (nextPart ? esc(nextPart) + ' →' : 'Next →') + '</button>') + '</div>';
    const t = main.querySelector('.tab[aria-selected="true"]');
    if (t && t.scrollIntoView) t.scrollIntoView({ block: 'nearest', inline: 'center' });
    if (sc.part !== 'Repeat') { pos[c.id] = sc.part; store.set('sw2.pos', pos); }
  }
  function go(d) {
    stopSound();
    const n = state.i + d;
    if (n < 0 || n >= state.screens.length) return;
    state.i = n; state.more = false; renderScreen();
  }
  function finish() {
    const c = state.c;
    done[c.id] = today(); store.set('sw2.done', done);
    state.screens.forEach(s => { if (s.from) reps[s.from.id] = today(); });
    store.set('sw2.rep', reps);
    delete pos[c.id]; store.set('sw2.pos', pos);
    location.hash = 'today';
  }
  function playAll() {
    const c = state.c;
    let p = Promise.resolve(), stop = false;
    c.d.forEach((d, j) => {
      p = p.then(() => {
        if (stop || state.c !== c || state.screens[state.i].t !== 'dialogue') { stop = true; return; }
        document.querySelectorAll('.ln.playing').forEach(x => x.classList.remove('playing'));
        const el = document.querySelector('[data-ln="' + j + '"]'); if (el) el.classList.add('playing');
        const my = seq + 1;
        return sayIn(c, clean(d[0])).then(() => { if (seq !== my) stop = true; return new Promise(r => setTimeout(r, 300)); });
      });
    });
    p.then(() => document.querySelectorAll('.ln.playing').forEach(x => x.classList.remove('playing')));
  }

  // ---------- Search: every word, most used first (the big list loads only here)
  let WORDS = null, AUDIO = null, DET = {}, q = '';
  const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  const fold = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[’ʼ]/g, "'");
  const where = {};       // English word -> the first cloud that has it
  ALL.forEach(c => c.w.concat(c.m).forEach(w => { const k = w.en.toLowerCase(); if (!where[k]) where[k] = c; }));
  function loadWords() {
    if (WORDS) return Promise.resolve();
    return Promise.all([loadScript('words.js'), loadScript('similar.js').catch(() => {})]).then(() => {
      AUDIO = window.AUDIO || null; DET = window.DETAILS = window.DETAILS || {};
      const list = (window.WORDS || []).map(w => Object.assign({ id: w.en + '|' + w.uk }, w));
      const seen = new Set(list.map(w => w.en.toLowerCase()));
      (window.SIMILAR || []).forEach(w => { const k = w.en.toLowerCase(); if (!seen.has(k)) { seen.add(k); list.push(Object.assign({ id: '~' + w.en + '|' + w.uk, sim: 1 }, w)); } });
      ALL.forEach(c => c.w.concat(c.m).forEach(w => { const k = w.en.toLowerCase(); if (!seen.has(k)) { seen.add(k); list.push({ id: '~' + w.en + '|' + w.uk, en: w.en, uk: w.uk, sim: w.k === '~' ? 1 : 0 }); } }));
      list.forEach(w => { w._k = fold(w.en) + '\n' + fold(w.uk); });
      WORDS = list;
    });
  }
  const rowHTML = w => '<div class="rw" data-row="' + esc(w.id) + '" tabindex="0" role="button" aria-expanded="false"><button class="say" data-word="' + esc(w.id) + '" aria-label="Listen">' + SAY + '</button>' +
    '<span class="r-en" lang="en">' + stressed(w) + '</span><span class="r-eq">' + (w.sim ? '≈' : '=') + '</span><span class="r-uk" lang="uk">' + esc(w.uk) + '</span></div>';
  let results = [], shownN = 0;
  function viewSearch() {
    main.innerHTML = '<h1>Search</h1><p class="muted" style="margin:8px 0 0">Every word that is the same or almost the same in Ukrainian. Type in English or Ukrainian.</p>' +
      '<input class="search" id="q" type="search" placeholder="taxi, метал, organize…" autocomplete="off" value="' + esc(q) + '">' +
      '<div class="count" id="count">Loading…</div><div id="res"></div>';
    loadWords().then(runSearch).catch(() => { const c = $('#count'); if (c) c.textContent = 'The word list could not be loaded.'; });
  }
  function runSearch() {
    if (!$('#res')) return;
    const f = fold(q.trim());
    if (f) {
      const a = [], b = [];
      WORDS.forEach(w => { const i = w._k.indexOf(f); if (i === 0 || w._k.indexOf('\n' + f) >= 0) a.push(w); else if (i > 0) b.push(w); });
      results = a.concat(b);
    } else results = WORDS.filter(w => !w.ns && !w.rude);
    shownN = 0;
    $('#count').textContent = results.length.toLocaleString('en-US') + (results.length === 1 ? ' word' : ' words') + (f ? '' : ', most used first');
    $('#res').innerHTML = results.length ? '<div class="rows" id="rows"></div><div class="more" id="morebox"></div>' : '';
    moreRows();
  }
  function moreRows() {
    const box = $('#rows'); if (!box) return;
    const to = Math.min(results.length, shownN + 80);
    box.insertAdjacentHTML('beforeend', results.slice(shownN, to).map(rowHTML).join(''));
    shownN = to;
    $('#morebox').innerHTML = to < results.length ? '<button class="btn sm" id="morerows">Show more</button>' : '';
  }
  const detLoads = {};
  const loadDetails = band => detLoads[band] || (detLoads[band] = loadScript('details-' + band + '.js').catch(e => { delete detLoads[band]; throw e; }));
  function detailHTML(w) {
    const d = DET[w.id], ex = ((d && d.ex) || []).filter(Boolean), c = where[w.en.toLowerCase()];
    return (d && d.say ? '<div><span class="muted">Say:</span> <span lang="en">' + esc(d.say) + '</span></div>' : '') +
      (ex.length ? '<ol>' + ex.map(e => '<li lang="en">' + esc(e) + '</li>').join('') + '</ol>' : '') +
      (d && d.note ? '<div class="note">' + esc(d.note) + '</div>' : '') +
      (c ? '<div class="note">In the cloud <a href="#c/' + c.id + '">' + esc(c.e + ' ' + c.en) + '</a></div>' : '');
  }
  function toggleRow(row) {
    const w = WORDS.find(x => x.id === row.dataset.row); if (!w) return;
    const nx = row.nextElementSibling;
    if (nx && nx.classList.contains('rw-more')) { nx.remove(); row.classList.remove('open'); row.setAttribute('aria-expanded', 'false'); return; }
    row.classList.add('open'); row.setAttribute('aria-expanded', 'true');
    row.insertAdjacentHTML('afterend', '<div class="rw-more">' + detailHTML(w) + '</div>');
    const box = row.nextElementSibling;
    playWord(w);
    if (!DET[w.id] && !w.sim && w.band) loadDetails(w.band).then(() => { if (box.isConnected) box.innerHTML = detailHTML(w); }).catch(() => {});
  }
  function playWord(w, btn) {
    const c = where[w.en.toLowerCase()];
    if (c && c.au && c.au[w.en]) return sayIn(c, w.en, btn);
    if (AUDIO && w.au) return playSeg('audio/' + AUDIO.chunks[w.au[0]], w.au[1], w.au[2], w.en, btn);
    stopSound(); speak(w.en);
  }

  // ---------- look-alikes to watch, and the student's own sentences
  function viewCareful() {
    const items = [];
    ALL.forEach(c => c.x.forEach(x => { if (!items.some(y => y.t === x[0])) items.push({ t: x[0], d: x[1], c }); }));
    main.innerHTML = '<h1>Careful: look-alikes</h1><p class="muted" lang="uk" style="margin:8px 0 0;max-width:60ch">Ці слова схожі на українські, але означають інше. ' +
      'Їх небагато: запам’ятайте їх, і решті схожих слів можна довіряти.</p>' +
      '<div class="ffs">' + items.map(x => '<div class="ffc"><b>' + esc(x.t) + '</b><p lang="uk">' + esc(x.d) + '</p><a href="#c/' + x.c.id + '">' + esc(x.c.e + ' ' + x.c.en) + '</a></div>').join('') + '</div>';
  }
  function viewMine() {
    const ids = Object.keys(mine).filter(id => BY.get(id) && mine[id].some(Boolean));
    main.innerHTML = '<h1>My sentences</h1><p class="muted" style="margin:8px 0 0">The sentences you wrote at the end of each cloud. They stay in this browser.</p>' +
      (ids.length ? ids.map(id => { const c = BY.get(id); return '<div class="mysent"><a href="#c/' + id + '"><b>' + esc(c.e + ' ' + c.en) + '</b></a><ul>' +
        mine[id].filter(Boolean).map(s => '<li lang="en">' + esc(s) + '</li>').join('') + '</ul></div>'; }).join('')
        : '<p style="margin-top:18px">Nothing yet. Finish a cloud and write three sentences you will use this week.</p>');
  }

  // ---------- routing and events
  function route() {
    const h = decodeURIComponent((location.hash || '').slice(1));
    const r = h.split('/')[0], arg = h.split('/')[1];
    stopSound();
    document.body.classList.remove('lesson');
    const name = r === 'clouds' || r === 'careful' ? 'clouds' : r === 'search' || r === 'words' ? 'search' : r === 'c' ? '' : 'today';
    document.querySelectorAll('.nav a').forEach(a => a.setAttribute('aria-current', a.dataset.nav === name ? 'page' : 'false'));
    if (r === 'c') openCloud(arg);
    else if (r === 'clouds') viewClouds();
    else if (r === 'search' || r === 'words') viewSearch();
    else if (r === 'careful') viewCareful();
    else if (r === 'mine') viewMine();
    else viewToday();      // also the older links (#learn, #lesson/…, #practice)
    if (r !== 'c') window.scrollTo(0, 0);
  }
  document.addEventListener('click', e => {
    const t = e.target.closest('button, .rw');
    if (!t) return;
    const c = state.c, inLesson = document.body.classList.contains('lesson');
    if (t.dataset.w != null) {                     // a word chip: on the home page or in a cloud
      const cc = inLesson ? c : state.teaser, list = inLesson && state.more ? cc.m : cc.w, w = list[+t.dataset.w];
      document.querySelectorAll('.chip.on').forEach(x => x.classList.remove('on'));
      t.classList.add('on');
      sayIn(cc, w.en);
      const hint = $('#hint');
      if (hint) hint.innerHTML = w.n ? '<span lang="uk">' + esc(w.n) + '</span>' : w.ex ? '<span lang="en">' + esc(w.ex) + '</span>'
        : '<b lang="en">' + esc(w.en) + '</b> ' + (w.k === '~' ? '≈' : '=') + ' <span lang="uk">' + esc(w.uk) + '</span>';
      return;
    }
    if (t.dataset.word) { e.stopPropagation(); playWord(WORDS.find(x => x.id === t.dataset.word), t); return; }
    if (t.classList.contains('rw')) { toggleRow(t); return; }
    if (t.id === 'morerows') { moreRows(); return; }
    if (!c || !inLesson) return;
    if (t.dataset.say) { sayIn(c.au && c.au[t.dataset.say] ? c : (state.screens[state.i].from || c), t.dataset.say, t); return; }
    if (t.dataset.part) { const i = state.screens.findIndex(s => s.part === t.dataset.part); if (i >= 0) { stopSound(); state.i = i; state.more = false; renderScreen(); } return; }
    if (t.id === 'next') { go(1); return; }
    if (t.id === 'back') { go(-1); return; }
    if (t.id === 'answer') { const sc = state.screens[state.i]; state.shown[state.i] = true; renderScreen(); sayIn(sc.from || c, sc.en); return; }
    if (t.id === 'finish') { finish(); return; }
    if (t.id === 'more') { state.more = !state.more; renderScreen(); return; }
    if (t.id === 'tr') { state.tr = !state.tr; renderScreen(); return; }
    if (t.id === 'playall') { playAll(); return; }
  });
  let qTimer = null;
  document.addEventListener('input', e => {
    if (e.target.id === 'q') { clearTimeout(qTimer); qTimer = setTimeout(() => { q = e.target.value; runSearch(); }, 130); }
    else if (e.target.dataset.mine != null && state.c) {
      const m = mine[state.c.id] || (mine[state.c.id] = ['', '', '']);
      m[+e.target.dataset.mine] = e.target.value; store.set('sw2.mine', mine);
    }
  });
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, textarea, select')) { if (e.key === 'Enter' && e.target.dataset.mine != null) e.target.blur(); return; }
    if (document.body.classList.contains('lesson')) {
      if (e.key === 'ArrowRight' || ((e.key === 'Enter' || e.key === ' ') && !(e.target.closest && e.target.closest('button, a')))) {
        e.preventDefault(); const b = $('#answer') || $('#next') || $('#finish'); if (b) b.click();
      } else if (e.key === 'ArrowLeft') { const b = $('#back'); if (b) b.click(); }
      else if (e.key === 'Escape') location.hash = 'today';
      return;
    }
    const a = document.activeElement;
    if ((e.key === 'Enter' || e.key === ' ') && a && a.classList && a.classList.contains('rw')) { e.preventDefault(); toggleRow(a); }
  });
  let sx = null;      // swipe left / right between screens
  document.addEventListener('pointerdown', e => { sx = e.target.closest && e.target.closest('.card') && !e.target.closest('input, button') ? [e.clientX, e.clientY] : null; });
  document.addEventListener('pointerup', e => {
    if (!sx || !document.body.classList.contains('lesson')) return;
    const dx = e.clientX - sx[0], dy = e.clientY - sx[1];
    sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > 1.6 * Math.abs(dy)) { if (dx < 0) { const b = $('#answer') || $('#next'); if (b) b.click(); } else go(-1); }
  });
  window.addEventListener('hashchange', route);
  if (canSpeak) { try { speechSynthesis.getVoices(); } catch (e) {} }
  route();
})();
</script>
</body>
</html>
