<style>
/* Same Words — three places: Learn (levels -> lessons with a story), Words (search the whole list), My words. */
:root {
  --bg: #f5f6f8;
  --card: #ffffff;
  --fg: #15181e;
  --muted: #687080;
  --line: #e0e3e9;
  --accent: #1f5fbf;
  --accent-soft: #e7eefb;
  --ok: #1e8a57;
  --word: "Literata", "PT Serif", Georgia, "Times New Roman", serif;
  --ui: "Golos Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --shadow: 0 1px 2px rgba(20, 28, 45, .05), 0 3px 10px rgba(20, 28, 45, .04);
  --a0: #2a9d68; --a1: #2687b8; --a2: #3b68d4; --b1: #7656d2; --b2: #b84f93; --c1: #cf7a22;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216; --card: #1a1d23; --fg: #eceef2; --muted: #9aa1ae; --line: #2b2f38;
    --accent: #7eaaf0; --accent-soft: #1c2940; --ok: #4cc38a; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101216; --card: #1a1d23; --fg: #eceef2; --muted: #9aa1ae; --line: #2b2f38;
  --accent: #7eaaf0; --accent-soft: #1c2940; --ok: #4cc38a; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 76px; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--ui); }
a { color: var(--accent); text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1080px; margin: 0 auto; padding: 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 12px; }
.brand { font-family: var(--word); font-weight: 600; font-size: 19px; color: var(--fg); white-space: nowrap; margin-right: auto; }
.brand span { color: var(--muted); font-weight: 500; }
.menu { display: flex; gap: 2px; }
.menu a { padding: 7px 13px; border-radius: 999px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.menu a:hover { color: var(--fg); }
.menu a[aria-current="page"] { color: var(--fg); background: var(--card); box-shadow: var(--shadow); }
.menu small { color: var(--muted); font-size: 12px; margin-left: 4px; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .brand span { display: none; } .menu a { padding: 7px 10px; } }

main { max-width: 1080px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-left, 0px)) 40px; min-height: 70vh; }
h1 { font-family: var(--word); font-weight: 600; font-size: clamp(26px, 4vw, 34px); line-height: 1.15; letter-spacing: -.01em; margin: 0 0 8px; }
h2 { font-family: var(--word); font-weight: 600; font-size: 20px; margin: 0 0 12px; }
.lead { color: var(--muted); font-size: 16px; max-width: 62ch; margin: 0 0 26px; }
.crumbs { font-size: 13.5px; color: var(--muted); margin: 0 0 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.blank { color: var(--muted); text-align: center; padding: 48px 0; }
.foot { max-width: 1080px; margin: 0 auto; padding: 8px 16px 32px; color: var(--muted); font-size: 12px; text-align: center; opacity: .85; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); font-weight: 500; color: var(--fg); white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--card); padding: 2px; }
.seg button { padding: 6px 12px; border-radius: 999px; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

/* Learn: levels */
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 0 0 40px; }
@media (max-width: 900px) { .levels { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .levels { grid-template-columns: minmax(0, 1fr); } }
.lv { display: flex; gap: 14px; padding: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: var(--shadow); color: inherit; min-width: 0; }
.lv:hover { border-color: var(--lc); }
.lv .code { flex: none; width: 54px; height: 54px; border-radius: 15px; display: grid; place-items: center; color: #fff;
  font: 600 21px var(--word); background: var(--lc); }
.lv .body { min-width: 0; flex: 1; }
.lv .name { font: 600 18px var(--word); }
.lv .about { color: var(--muted); font-size: 13.5px; line-height: 1.4; margin-top: 2px; }
.lv .stats { color: var(--muted); font-size: 12.5px; margin-top: 8px; font-variant-numeric: tabular-nums; }
.prog { height: 4px; border-radius: 4px; background: var(--line); margin-top: 6px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--lc); border-radius: 4px; }
.cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.col { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 16px; background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; box-shadow: var(--shadow); color: inherit; min-width: 0; }
.col:hover { border-color: var(--accent); }
.col b { font: 600 16.5px var(--word); }
.col span { color: var(--muted); font-size: 13px; line-height: 1.4; }

/* level page: sections of lessons */
.lvhead { display: flex; gap: 16px; align-items: center; margin-bottom: 6px; }
.lvhead .code { width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; color: #fff; font: 600 20px var(--word); background: var(--lc); flex: none; }
.lvhead h1 { margin: 0; }
.secnav { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 26px; }
.secnav button { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 13px; color: var(--muted); }
.secnav button:hover { color: var(--fg); }
.sec { margin: 0 0 30px; scroll-margin-top: 76px; }
.lessons { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .lessons { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .lessons { grid-template-columns: minmax(0, 1fr); } }
.ls { display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: var(--shadow); color: inherit; min-width: 0; }
.ls:hover { border-color: var(--lc, var(--accent)); }
.ls .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.ls .n .ok { color: var(--ok); font-weight: 500; }
.ls b { font: 600 16.5px var(--word); line-height: 1.25; }
.ls .w { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* lesson page */
.lesson-meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; margin-bottom: 6px; }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; color: #fff; font-size: 12.5px; font-weight: 600; background: var(--lc, var(--accent)); }
.story { font-size: 18px; line-height: 1.72; max-width: 68ch; white-space: pre-line; background: var(--card); border: 1px solid var(--line);
  border-radius: 18px; padding: 20px 24px; margin: 14px 0 18px; box-shadow: var(--shadow); }
@media (max-width: 560px) { .story { font-size: 17px; padding: 16px 18px; } }
.story .sw { font-weight: 600; color: var(--fg); background: var(--accent-soft); border-radius: 5px; padding: 0 4px; cursor: pointer; }
.story .sw:hover { color: var(--accent); }
.story-hint { color: var(--muted); font-size: 13px; margin: -10px 0 18px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 16px; }
.actions .spacer { flex: 1; }
.btn.done { color: var(--ok); border-color: var(--ok); }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 26px; font-size: 14.5px; }

/* Words: search and filters */
.search-row { position: relative; margin: 0 0 12px; }
.search-row svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search { width: 100%; padding: 13px 16px 13px 44px; font: inherit; font-size: 16px; color: var(--fg); border-radius: 14px;
  border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); }
.search:focus { outline: none; border-color: var(--accent); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 16px; }
.sel { appearance: none; -webkit-appearance: none; padding: 7px 30px 7px 12px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer;
  font: inherit; font-size: 14px; color: var(--fg); max-width: 70vw;
  background: var(--card) linear-gradient(45deg, transparent 50%, var(--muted) 50%) no-repeat calc(100% - 16px) 52% / 5px 5px,
              var(--card) linear-gradient(135deg, var(--muted) 50%, transparent 50%) no-repeat calc(100% - 11px) 52% / 5px 5px; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); padding: 6px 4px; cursor: pointer; }
.count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.filters .count { margin-left: auto; }

/* cards (flip) */
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 900px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .grid .card { aspect-ratio: 3 / 4; } }
@media (max-width: 640px) { .grid { grid-template-columns: minmax(0, 440px); justify-content: center; } .grid .card { aspect-ratio: 4 / 5; } }
.card { position: relative; perspective: 1000px; aspect-ratio: 4 / 5; cursor: pointer; border-radius: 14px; max-width: 100%; container-type: inline-size; }
.inner { position: absolute; inset: 0; transition: transform .45s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; }
.card.flipped .inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 14px; text-align: center; min-width: 0; }
.back { transform: rotateY(180deg); justify-content: flex-start; align-items: stretch; text-align: left; gap: 8px; overflow-y: auto; scrollbar-width: thin; }
.back.more-below { -webkit-mask-image: linear-gradient(#000 calc(100% - 22px), transparent); mask-image: linear-gradient(#000 calc(100% - 22px), transparent); }
.en, .uk { font-family: var(--word); line-height: 1.12; overflow-wrap: break-word; hyphens: manual; max-width: 100%; }
.en { font-size: clamp(24px, 2.9vw, 34px); font-size: clamp(22px, min(16cqi, 150cqi / var(--n, 6)), var(--max-en, 60px)); font-weight: 600; }
.uk { font-size: clamp(21px, 2.5vw, 29px); font-size: clamp(19px, min(13.5cqi, 135cqi / var(--n, 6)), var(--max-uk, 50px)); font-weight: 500; color: var(--muted); }
.eq { color: var(--muted); font-size: 18px; font-size: clamp(16px, 6cqi, 26px); line-height: 1.1; margin: .12em 0; }
.st { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: .16em; text-decoration-color: var(--accent); }
.more { display: flex; justify-content: center; padding-top: 12px; }
.flag { position: absolute; top: 12px; left: 12px; width: 22px; height: 14px; border-radius: 2px; box-shadow: 0 0 0 1px var(--line); }
.icon { position: absolute; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
@media (hover: hover) { .icon:hover { background: var(--accent-soft); color: var(--accent); } }
.icon svg { width: 18px; height: 18px; }
.icon.busy { color: var(--accent); }
.icon.busy svg { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.say { bottom: 6px; left: 6px; }
.mk { position: absolute; bottom: 12px; right: 12px; font-size: 11.5px; line-height: 1.5; padding: 0 8px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.mk-s { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.add { top: 6px; right: 6px; }
.add.on { color: var(--accent); }
@media (pointer: coarse) { .icon { width: 44px; height: 44px; } .say { bottom: 2px; left: 2px; } .add { top: 2px; right: 2px; } }
.card.flash .face { box-shadow: 0 0 0 3px var(--accent); transition: box-shadow .2s; }
.back .top { display: flex; flex-direction: column; gap: 8px; flex: none; }
.back .pic { flex: none; width: 100%; aspect-ratio: 3 / 1; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; color: var(--line); }
.back .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.back .pic svg { width: 30px; height: 30px; }
.back .pic.has { border: 0; }
.back .pic.emoji { position: relative; border-color: transparent; background: var(--accent-soft); }
.back .pic.emoji img { position: absolute; inset: 0; margin: auto; width: 100%; height: 100%; max-width: 160px; max-height: 160px; object-fit: contain; padding: 8px; }
.back .id { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.back .txt { display: flex; flex-direction: column; gap: 6px; min-height: 0; min-width: 0; flex: 1 0 auto; }
.back .head { display: flex; align-items: center; gap: 6px; font-family: var(--word); font-weight: 600; font-size: 19px; line-height: 1.2; }
.back .head > span { min-width: 0; overflow-wrap: anywhere; }
.back .meta { font-size: 12.5px; color: var(--muted); }
.back .head .say-btn { position: static; flex: none; width: 28px; height: 28px; margin-left: auto; }
.back .rank { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
@media (min-width: 641px) {
  .grid .back .top { flex-direction: row; align-items: flex-start; gap: 10px; }
  .grid .back .pic { width: 30%; aspect-ratio: 1; }
  .grid .back .pic svg { width: 24px; height: 24px; }
  .grid .back .id { flex: 1; }
}
.back .say-line { font-size: 13px; }
.back .say-line span { color: var(--muted); }
.back ol { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 1.32; }
.back ol b { font-weight: 600; color: var(--fg); }
.back .note { margin-top: auto; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font: 400 11.5px var(--ui); letter-spacing: .02em; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.loading { color: var(--muted); font-size: 13px; }
.single { display: flex; flex-direction: column; align-items: center; gap: 16px; --max-en: 84px; --max-uk: 70px; }
.single .card { width: min(620px, 100%); aspect-ratio: 3 / 2; touch-action: pan-y; }
.single .back { display: grid; grid-template-columns: 38% minmax(0, 1fr); grid-template-rows: auto 1fr; gap: 8px 16px; align-content: start; }
.single .back .top { display: contents; }
.single .back .pic { grid-column: 1; grid-row: 1 / span 2; aspect-ratio: auto; height: 100%; }
.single .back .id { grid-column: 2; grid-row: 1; }
.single .back .txt { grid-column: 2; grid-row: 2; }
.single .back ol { font-size: 15px; gap: 6px; }
@media (max-width: 560px) {
  .single .card { aspect-ratio: 4 / 5; }
  .single .back { display: flex; flex-direction: column; }
  .single .back .top { display: flex; }
  .single .back .pic { aspect-ratio: 3 / 1; height: auto; }
}
.nav { display: flex; gap: 10px; align-items: center; }
.nav .btn { min-width: 48px; justify-content: center; }

/* practice */
.train { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; --max-en: 84px; --max-uk: 70px; }
.train .card { width: min(520px, 100%); aspect-ratio: 3 / 2; cursor: default; }
.train .uk { color: var(--fg); font-weight: 600; }
.train .en { color: var(--accent); }
.train .hint { color: var(--muted); font-size: 13.5px; max-width: 50ch; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.score { font-family: var(--word); font-size: 30px; }
@media (prefers-reduced-motion: reduce) { .inner { transition: none; } }
</style>

<script>
(function () {

  const BY_ID = new Map(WORDS.map(w => [w.id, w]));
  const BY_EN = new Map(WORDS.map(w => [w.en, w]));

  const BAND_NAMES = { 'top-1000': 'Top 1000', 'top-2000': 'Top 2000', 'top-3000': 'Top 3000', 'top-5000': 'Top 5000',
    'top-10k': 'Top 10K', 'top-20k': 'Top 20K', 'top-50k': 'Top 50K', 'top-100k': 'Top 100K', 'rare': 'Rare' };
  const TOPIC_NAMES = { food: 'Food', drinks: 'Drinks', sport: 'Sport', music: 'Music', art: 'Art', media: 'Media', tech: 'Tech',
    science: 'Science', medicine: 'Medicine', chemistry: 'Chemistry', physics: 'Physics', biology: 'Biology', math: 'Math',

                  a: ['anglicism', 'Ukrainians use this as an English word (like містер, стаф)'] };
  const PAGE = 120;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const norm = s => String(s).normalize ? String(s).normalize('NFC') : String(s);
  const mine = new Set(store.get('sw.mine', []).map(norm));
  const done = new Set(store.get('sw.done', []));
  const saved = store.get('sw.filters', {});
  const state = { route: 'learn', arg: '', view: store.get('sw.view', 'grid'), idx: 0, list: [],
    q: '', band: saved.band || '', topic: saved.topic || '', kind: saved.kind || '', hideNs: store.get('sw.hideNs2', true),

  const $ = s => document.querySelector(s);

    let l = wordsBase();
    if (state.topic) l = l.filter(w => (w.topics || []).indexOf(state.topic) >= 0);
    const q = fold(state.q.trim());
    if (q) {
      const starts = [], has = [];
      l.forEach(w => { const i = w._k.indexOf(q); if (i === 0 || w._k.indexOf('\n' + q) >= 0) starts.push(w); else if (i > 0) has.push(w); });
      l = starts.concat(has);
    }
    return l;
  }
  function topicOptions() {
    const counts = {};
    wordsBase().forEach(w => (w.topics || []).forEach(t => counts[t] = (counts[t] || 0) + 1));
    if (state.topic && !counts[state.topic]) state.topic = '';
    const keys = Object.keys(counts).sort((a, b) => (a === 'other') - (b === 'other') || counts[b] - counts[a]);
    return '<option value="">All topics</option>' + keys.map(k => '<option value="' + k + '"' + (k === state.topic ? ' selected' : '') + '>' +
      (TOPIC_NAMES[k] || k) + ' · ' + counts[k] + '</option>').join('');
  }
  function viewWords() {
    const opt = (v, label, cur) => '<option value="' + v + '"' + (v === cur ? ' selected' : '') + '>' + label + '</option>';
    $('#main').innerHTML =
      '<h1>All words</h1>' +
      '<p class="lead">Search all ' + WORDS.length.toLocaleString('en-US') + ' words. Sorted by how often the English word is used, most common first.</p>' +
      '<div class="search-row">' + SEARCH + '<input class="search" id="q" type="search" placeholder="Search in English or Ukrainian" autocomplete="off" value="' + esc(state.q) + '"></div>' +
      '<div class="filters">' +
        '<select class="sel" id="f-band" aria-label="How common">' + opt('', 'All frequencies', state.band) +
          BANDS.map(b => opt(b, BAND_NAMES[b], state.band)).join('') + '</select>' +
        '<select class="sel" id="f-topic" aria-label="Topic"></select>' +
        '<select class="sel" id="f-kind" aria-label="Kind">' + opt('', 'All kinds', state.kind) + opt('s', '★ English too', state.kind) +
          opt('a', 'Anglicisms', state.kind) + opt('x', 'Exclamations', state.kind) + '</select>' +
        '<label class="chk" title="Hide pairs where the Ukrainian word is slang or rare (піпл, френд) and rude English words">' +
          '<input type="checkbox" id="f-ns"' + (state.hideNs ? ' checked' : '') + '> Hide slang</label>' +
        viewSwitch() + '<span class="count" id="count"></span></div>' +
      '<div id="cards"></div>';
    refreshWords();
  }
  function refreshWords(keepIdx) {
    const t = $('#f-topic'); if (t) t.innerHTML = topicOptions();
    const list = wordsList();
    $('#count').textContent = plural(list.length, 'word');
    if (!keepIdx) state.idx = 0;
    showCards(list);
    store.set('sw.filters', { band: state.band, topic: state.topic, kind: state.kind });
  }

  // ---------- My words
  function viewMine() {
    const list = WORDS.filter(w => mine.has(w.id));
    $('#main').innerHTML = '<h1>My words</h1>' +
      (list.length
        ? '<p class="lead">' + plural(list.length, 'word') + ' saved in this browser. Press ✓ on a card to remove it.</p>' +
          '<div class="actions"><button class="btn primary" id="practice">Practice my words</button><span class="spacer"></span>' + viewSwitch() + '</div><div id="cards"></div>'
        : '<p class="lead">Press + on any card to save it here, then practice your words.</p>' +
          '<div class="actions"><a class="btn primary" href="#learn">Start learning</a><a class="btn" href="#words">Browse all words</a></div>');
    state.idx = 0;
    if (list.length) showCards(list);
  }

  // ---------- Practice: see the Ukrainian word, recall the English word
  let tr = null;
  function startPractice(words, title, lesson) {
    state.pool = words.slice(); state.poolTitle = title; state.poolLesson = lesson || '';
    tr = null;
    if (location.hash !== '#practice') location.hash = 'practice'; else viewPractice();
  }
  function viewPractice() {
    if (!state.pool || !state.pool.length) {
      const m = WORDS.filter(w => mine.has(w.id));
      if (m.length) { state.pool = m; state.poolTitle = 'My words'; state.poolLesson = ''; }
      else { $('#main').innerHTML = '<h1>Practice</h1><p class="lead">Open a lesson and press "Practice these words", or save words with +.</p><a class="btn primary" href="#learn">Go to lessons</a>'; return; }
    }
    if (!tr) { const q = shuffled(state.pool); tr = { queue: q, i: 0, shown: false, known: 0, again: [], missed: new Set(), total: q.length, round: 1 }; }
    if (tr.i >= tr.queue.length) {
      if (tr.again.length) { tr.queue = tr.again; tr.again = []; tr.i = 0; tr.round++; }
      else {
        if (state.poolLesson) { done.add(state.poolLesson); store.set('sw.done', Array.from(done)); }
        $('#main').innerHTML = '<div class="train"><div class="hint">' + esc(state.poolTitle) + '</div><div class="score">' + tr.known + ' / ' + tr.total + '</div>' +
          '<div class="hint">known on the first try' + (state.poolLesson ? ' · lesson marked as learned' : '') + '</div>' +
          '<div class="row"><button class="btn primary" id="t-restart">Practice again</button>' +
          (state.poolLesson ? '<a class="btn" href="#lesson/' + state.poolLesson + '">Back to the lesson</a>' : '<a class="btn" href="#learn">Lessons</a>') + '</div></div>';
        return;
      }
    }
    const w = tr.queue[tr.i];
    $('#main').innerHTML = '<div class="train"><div class="hint">' + esc(state.poolTitle) + '</div>' +
      '<div class="card"><div class="inner"><div class="face front">' +
        '<div class="uk" lang="uk" style="--n:' + longest(w.uk) + '">' + esc(w.uk) + '</div><div class="eq">=</div>' +
        '<div class="en" style="--n:' + longest(w.en) + '">' + (tr.shown ? stressed(w) : '?') + '</div>' +
        (tr.shown && canPlay(w) ? '<button class="icon say" data-sayid="' + esc(w.id) + '" aria-label="Pronounce">' + SAY + '</button>' : '') +
      '</div></div></div>' +
      '<div class="row">' + (tr.shown
        ? '<button class="btn" id="t-again">Again</button><button class="btn primary" id="t-know">I knew it</button>'
        : '<button class="btn primary" id="t-show">Show English</button>') + '</div>' +
      '<div class="count">' + (tr.round > 1 ? 'Round ' + tr.round + ' · ' : '') + (tr.i + 1) + ' / ' + tr.queue.length + ' · keys: Space, 1, 2</div></div>';
  }
  function answer(knew) {
    const w = tr.queue[tr.i];
    if (knew) { if (!tr.missed.has(w.id)) tr.known++; } else { tr.missed.add(w.id); tr.again.push(w); }
    tr.i++; tr.shown = false; viewPractice();
  }

  // ---------- routing
  function route() {
    let h = decodeURIComponent((location.hash || '').slice(1));
    if (BANDS.indexOf(h.toLowerCase()) >= 0) { state.band = h.toLowerCase(); state.topic = ''; h = 'words'; }   // older links: #top-1000
    if (h === 'stories' || /^story-/.test(h) || !h) h = 'learn';
    if (h === 'train') h = 'practice';
    const [r, arg] = h.split('/');
    state.route = r; state.arg = arg || '';
    document.querySelectorAll('.menu a').forEach(a => a.setAttribute('aria-current',
      a.dataset.nav === (r === 'level' || r === 'lesson' || r === 'ex' ? 'learn' : r) ? 'page' : 'false'));
    renderMineCount();
    const needCourse = r === 'learn' || r === 'level' || r === 'lesson' || r === 'ex';
    if (needCourse && !C()) {
      $('#main').innerHTML = '<div class="blank">Loading…</div>';
      loadCourse().then(route).catch(() => { $('#main').innerHTML = '<div class="blank">The lessons could not be loaded. <a href="#words">Browse all words</a></div>'; });
      return;
    }
    if (r === 'level') viewLevel(state.arg);
    else if (r === 'lesson') viewLesson(state.arg);
    else if (r === 'ex') viewExclamations();
    else if (r === 'words') viewWords();
    else if (r === 'mine') viewMine();
    else if (r === 'practice') viewPractice();
    else viewLearn();
    window.scrollTo(0, 0);
  }
  function renderMineCount() { const n = mine.size; $('#mine-n').textContent = n ? n : ''; }

  // ---------- events
  let swiped = false;
  document.addEventListener('click', e => {
    if (swiped) { swiped = false; return; }
    const sw = e.target.closest('.sw');
    if (sw) { storyWord(sw.dataset.sw); return; }
    const t = e.target.closest('button, .card');
    if (!t) return;
    if (t.dataset.sayid) { e.stopPropagation(); playWord(BY_ID.get(t.dataset.sayid), t); return; }
    if (t.dataset.add) {
      e.stopPropagation();
      const id = t.dataset.add;
      mine.has(id) ? mine.delete(id) : mine.add(id);
      store.set('sw.mine', Array.from(mine));
      if (state.route === 'mine' && !mine.has(id)) { viewMine(); renderMineCount(); return; }
      t.classList.toggle('on', mine.has(id)); t.innerHTML = mine.has(id) ? CHECK : PLUS;
      t.setAttribute('aria-label', mine.has(id) ? 'Remove from my words' : 'Add to my words');
      renderMineCount(); return;
    }
    if (t.dataset.view) {
      state.view = t.dataset.view; store.set('sw.view', state.view);
      document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === state.view));
      state.idx = 0; showCards(state.list); return;
    }
    if (t.dataset.collect) { state.kind = t.dataset.collect; state.band = ''; state.topic = ''; state.q = ''; location.hash = 'words'; return; }
    if (t.dataset.sec) { const s = document.getElementById('sec-' + t.dataset.sec); if (s) s.scrollIntoView({ behavior: 'smooth' }); return; }
    if (t.id === 'show-more') { appendCards(); return; }
    if (t.id === 'prev') { move(-1); return; }
    if (t.id === 'next') { move(1); return; }
    if (t.id === 'practice') {
      if (state.route === 'lesson') { const f = findLesson(state.arg); if (f) startPractice(state.list, f.l.title, f.l.level ? f.l.id : ''); }
      else startPractice(state.list, 'My words', '');
      return;
    }
    if (t.id === 'learned') {
      const id = state.arg; done.has(id) ? done.delete(id) : done.add(id); store.set('sw.done', Array.from(done));
      t.classList.toggle('done', done.has(id)); t.textContent = done.has(id) ? '✓ Learned' : 'Mark as learned'; return;
    }
    if (t.id === 't-show') { tr.shown = true; viewPractice(); playWord(tr.queue[tr.i]); return; }
    if (t.id === 't-know') { answer(true); return; }
    if (t.id === 't-again') { answer(false); return; }
    if (t.id === 't-restart') { tr = null; viewPractice(); return; }
    if (t.classList.contains('card') && !t.closest('.train')) {
      if (String(window.getSelection ? getSelection() : '')) return;   // selecting text should not flip
      flip(t);
    }
  });
  function storyWord(en) {   // a word in the story: say it and show its card
    const w = BY_EN.get(en); if (!w) return;
    playWord(w);
    if (state.view === 'single') { const i = state.list.indexOf(w); if (i >= 0 && i !== state.idx) { state.idx = i; showCards(state.list); } }
    const card = Array.from(document.querySelectorAll('.card')).find(c => c.dataset.id === w.id);
    if (!card) return;
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.add('flash'); setTimeout(() => card.classList.remove('flash'), 1200);
  }
  let qTimer = null;
  document.addEventListener('input', e => {
    if (e.target.id === 'q') { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value; refreshWords(); }, 120); }
  });
  document.addEventListener('change', e => {
    const id = e.target.id;
    if (id === 'f-band') { state.band = e.target.value; refreshWords(); }
    else if (id === 'f-topic') { state.topic = e.target.value; refreshWords(); }
    else if (id === 'f-kind') { state.kind = e.target.value; refreshWords(); }
    else if (id === 'f-ns') { state.hideNs = e.target.checked; store.set('sw.hideNs2', state.hideNs); refreshWords(); }
  });
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, textarea, select')) return;
    if (state.route === 'practice' && tr) {
      if ((e.key === ' ' || e.key === 'Enter') && !tr.shown && $('#t-show')) { e.preventDefault(); $('#t-show').click(); }
      else if ((e.key === '1' || e.key === 'ArrowLeft') && tr.shown) answer(false);
      else if ((e.key === '2' || e.key === 'ArrowRight') && tr.shown) answer(true);
      return;
    }
    const a = document.activeElement;
    if ((e.key === 'Enter' || e.key === ' ') && a && a.classList && a.classList.contains('sw')) { e.preventDefault(); storyWord(a.dataset.sw); return; }
    if (e.key === 'ArrowRight' && state.view === 'single' && $('.single')) move(1);
    else if (e.key === 'ArrowLeft' && state.view === 'single' && $('.single')) move(-1);
    else if (e.key === ' ' || e.key === 'Enter') {
      if (a && a.tagName === 'BUTTON') return;
      const card = a && a.classList && a.classList.contains('card') ? a
        : (state.view === 'single' && (!a || a === document.body) ? document.querySelector('.single .card') : null);
      if (card) { e.preventDefault(); flip(card); }
    }
  });
  let sx = null;   // swipe left/right in One by one view
  document.addEventListener('pointerdown', e => { sx = e.target.closest && e.target.closest('.single .card') ? [e.clientX, e.clientY] : null; });
  document.addEventListener('pointerup', e => {
    if (!sx) return;
    const dx = e.clientX - sx[0], dy = e.clientY - sx[1];
    sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > 1.5 * Math.abs(dy)) { swiped = true; move(dx < 0 ? 1 : -1); setTimeout(() => { swiped = false; }, 400); }
  });
  window.addEventListener('hashchange', route);
  if (canSpeak) { try { speechSynthesis.getVoices(); } catch (e) {} }
  route();
})();
</script>
