<title>Same Words</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<style>
/* Layout: one quiet toolbar (frequency bands + view), then cards — a 4-column grid or a single card. */
:root {
  --bg: #f4f5f7;
  --card: #ffffff;
  --fg: #16191f;
  --muted: #6a7180;
  --line: #dfe2e8;
  --accent: #1f5fbf;
  --accent-soft: #e6eefb;
  --word: "Literata", "PT Serif", Georgia, "Times New Roman", serif;
  --ui: "Golos Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --shadow: 0 1px 2px rgba(20, 28, 45, .06), 0 2px 8px rgba(20, 28, 45, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --card: #1b1e24; --fg: #eceef2; --muted: #9aa1ae; --line: #2c3039;
    --accent: #7eaaf0; --accent-soft: #1d2a40; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --card: #1b1e24; --fg: #eceef2; --muted: #9aa1ae; --line: #2c3039;
  --accent: #7eaaf0; --accent-soft: #1d2a40; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, .card:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; justify-content: space-between; }
.brand { font-family: var(--word); font-weight: 600; font-size: 20px; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-weight: 500; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip {
  padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--card);
  font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.chip small { color: var(--muted); font-size: 12px; margin-left: 4px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .7; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; flex: 0 0 auto; }
@media (max-width: 1100px) and (min-width: 641px) { .sep { display: none; } }
.tools { display: flex; gap: 6px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
select.chip { appearance: none; -webkit-appearance: none; padding-right: 28px; cursor: pointer; font: inherit; font-size: 14px; color: var(--fg);
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; max-width: 60vw; }
@media (max-width: 640px) {
  /* one swipeable row of bands on phones, so the cards start on the first screen */
  #levels { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; width: calc(100% + 32px); margin-inline: -16px; padding-inline: 16px; scroll-padding-inline: 16px; }
  #levels::-webkit-scrollbar { display: none; }
}

/* cards */
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 900px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .grid .card { aspect-ratio: 3 / 4; } }
@media (max-width: 640px) { .grid { grid-template-columns: minmax(0, 440px); justify-content: center; } .grid .card { aspect-ratio: 4 / 5; } }

.card { position: relative; perspective: 1000px; aspect-ratio: 4 / 5; cursor: pointer; border-radius: 14px; max-width: 100%; container-type: inline-size; }
.inner { position: absolute; inset: 0; transition: transform .45s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; }
.card.flipped .inner { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 14px; text-align: center; min-width: 0;
}
.back { transform: rotateY(180deg); justify-content: flex-start; align-items: stretch; text-align: left; gap: 8px; overflow-y: auto; scrollbar-width: thin; }
.back.more-below { -webkit-mask-image: linear-gradient(#000 calc(100% - 22px), transparent); mask-image: linear-gradient(#000 calc(100% - 22px), transparent); }
/* the word is sized from the card width and its longest part, so long words never break mid-word */
.en, .uk { font-family: var(--word); line-height: 1.12; overflow-wrap: break-word; hyphens: manual; max-width: 100%; }
.en { font-size: clamp(24px, 2.9vw, 34px); font-size: clamp(22px, min(16cqi, 150cqi / var(--n, 6)), var(--max-en, 60px)); font-weight: 600; }
.uk { font-size: clamp(21px, 2.5vw, 29px); font-size: clamp(19px, min(13.5cqi, 135cqi / var(--n, 6)), var(--max-uk, 50px)); font-weight: 500; color: var(--muted); }
.eq { color: var(--muted); font-size: 18px; font-size: clamp(16px, 6cqi, 26px); line-height: 1.1; margin: .12em 0; }
.st { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: .16em; text-decoration-color: var(--accent); }
.more { display: flex; justify-content: center; padding-top: 8px; }
.flag { position: absolute; top: 12px; left: 12px; width: 22px; height: 14px; border-radius: 2px; box-shadow: 0 0 0 1px var(--line); }
.icon { position: absolute; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
@media (hover: hover) { .icon:hover { background: var(--accent-soft); color: var(--accent); } }
.icon svg { width: 18px; height: 18px; }
.icon.busy { color: var(--accent); }
.icon.busy svg { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.say { bottom: 6px; left: 6px; }
.add { top: 6px; right: 6px; }
.add.on { color: var(--accent); }
@media (pointer: coarse) { .icon { width: 44px; height: 44px; } .say { bottom: 2px; left: 2px; } .add { top: 2px; right: 2px; } }

/* back of the card: picture place + word, then examples and note */
.back .top { display: flex; flex-direction: column; gap: 8px; flex: none; }
.back .pic { flex: none; width: 100%; aspect-ratio: 3 / 1; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; color: var(--line); }
.back .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.back .pic svg { width: 30px; height: 30px; }
.back .pic.has { border: 0; }
.back .pic.emoji { position: relative; border-color: transparent; background: var(--accent-soft); }
.back .pic.emoji img { position: absolute; inset: 0; margin: auto; width: 100%; height: 100%; max-width: 160px; max-height: 160px; object-fit: contain; padding: 8px; }
.back .id { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.back .txt { display: flex; flex-direction: column; gap: 6px; min-height: 0; min-width: 0; flex: 1 0 auto; }
.back .head { display: flex; align-items: center; gap: 6px; font-family: var(--word); font-weight: 600; font-size: 19px; line-height: 1.2; }
.back .head > span { min-width: 0; overflow-wrap: anywhere; }
.back .meta { font-size: 12.5px; color: var(--muted); }
.back .head .say-btn { position: static; flex: none; width: 28px; height: 28px; margin-left: auto; }
.back .rank { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
/* grids with several columns: a small square picture beside the word, so the examples fit on the card */
@media (min-width: 641px) {
  .grid .back .top { flex-direction: row; align-items: flex-start; gap: 10px; }
  .grid .back .pic { width: 30%; aspect-ratio: 1; }
  .grid .back .pic svg { width: 24px; height: 24px; }
  .grid .back .id { flex: 1; }
}
.back .say-line { font-size: 13px; }
.back .say-line span { color: var(--muted); }
.back ol { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 1.32; }
.back ol b { font-weight: 600; color: var(--fg); }
.back .note { margin-top: auto; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font: 400 11.5px var(--ui); letter-spacing: .02em; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.loading { color: var(--muted); font-size: 13px; }

/* single view */
.single { display: flex; flex-direction: column; align-items: center; gap: 16px; --max-en: 84px; --max-uk: 70px; }
.single .card { width: min(620px, 100%); aspect-ratio: 3 / 2; touch-action: pan-y; }
.single .back { display: grid; grid-template-columns: 38% minmax(0, 1fr); grid-template-rows: auto 1fr; gap: 8px 16px; align-content: start; }
.single .back .top { display: contents; }
.single .back .pic { grid-column: 1; grid-row: 1 / span 2; aspect-ratio: auto; height: 100%; }
.single .back .id { grid-column: 2; grid-row: 1; }
.single .back .txt { grid-column: 2; grid-row: 2; }
.single .back ol { font-size: 15px; gap: 6px; }
@media (max-width: 560px) {
  .single .card { aspect-ratio: 4 / 5; }
  .single .back { display: flex; flex-direction: column; }
  .single .back .top { display: flex; }
  .single .back .pic { aspect-ratio: 3 / 1; height: auto; }
}
.nav { display: flex; gap: 10px; align-items: center; }
.nav .chip { min-width: 44px; text-align: center; }

/* training */
.train { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; --max-en: 84px; --max-uk: 70px; }
.train .card { width: min(520px, 100%); aspect-ratio: 3 / 2; cursor: default; }
.train .uk { color: var(--fg); font-weight: 600; }
.train .en { color: var(--accent); }
.train .hint { color: var(--muted); font-size: 13px; max-width: 46ch; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.big { padding: 10px 18px; font-size: 15px; }
.big.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.score { font-family: var(--word); font-size: 28px; }

/* stories: chapters of words that make a little story */
.toc { display: flex; flex-direction: column; gap: 26px; }
.toc h2 { font-family: var(--word); font-weight: 600; font-size: 20px; margin: 0 0 2px; }
.toc section { scroll-margin-top: 12px; }
.toc .parts .chip { font-size: 13px; padding: 5px 10px; }
.toc .about { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
.tile { display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); box-shadow: var(--shadow); color: inherit; text-decoration: none; min-width: 0; }
.tile:hover { border-color: var(--accent); }
.tile .tn { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.tile b { font-family: var(--word); font-weight: 600; font-size: 16px; line-height: 1.25; }
.tile .tw { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chapter { display: flex; flex-direction: column; gap: 14px; }
.ch-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.ch-top a, .ch-nav a { color: var(--accent); text-decoration: none; }
.chapter h2 { font-family: var(--word); font-weight: 600; font-size: clamp(22px, 3vw, 28px); margin: 0; }
.story { font-size: 17px; line-height: 1.65; max-width: 70ch; margin: 0; white-space: pre-line; }
.story .sw { font-weight: 600; color: var(--fg); background: var(--accent-soft); border-radius: 4px; padding: 0 3px; cursor: pointer; }
.story .sw:hover { color: var(--accent); }
.ch-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.ch-nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 6px; font-size: 14px; }
.card.flash .face { box-shadow: 0 0 0 3px var(--accent); transition: box-shadow .2s; }

.blank { color: var(--muted); text-align: center; padding: 48px 0; }
.foot { color: var(--muted); font-size: 12px; text-align: center; padding-top: 28px; opacity: .8; }
@media (prefers-reduced-motion: reduce) { .inner { transition: none; } }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <clipPath id="fc"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
  <clipPath id="ft"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
</defs></svg>
<div class="wrap">
  <header>
    <div class="brand">Same Words <span lang="uk">· Однакові слова</span></div>
    <nav class="bar" id="levels" aria-label="How often the English word is used"></nav>
  </header>
  <div class="tools">
    <div class="bar" id="views" role="group" aria-label="View">
      <button class="chip" id="v-grid" data-view="grid">Grid</button>
      <button class="chip" id="v-single" data-view="single">One by one</button>
      <button class="chip" id="v-shuffle" aria-pressed="false" title="Shuffle the cards (press again for frequency order)">Shuffle</button>
      <select class="chip" id="topic" aria-label="Topic"></select>
      <button class="chip" id="f-ns" aria-pressed="true" title="Hide pairs where the Ukrainian word is slang or rare (піпл, френд) and rude English words">Hide slang</button>
    </div>
    <div class="count" id="count" aria-live="polite"></div>
  </div>
  <main id="main"></main>
  <footer class="foot">Pictures: Noto Emoji by Google (Apache 2.0) · Voice: Kokoro-82M</footer>
</div>

<script src="words.js"></script>
<script>
(function () {
  'use strict';
  const WORDS = (window.WORDS || []).map(w => Object.assign({ id: w.id || (w.en + '|' + w.uk) }, w));
  const BY_ID = new Map(WORDS.map(w => [w.id, w]));
  // categories = how often the English word is used in the card's meaning
  const LEVELS = ['top-1000', 'top-2000', 'top-3000', 'top-5000', 'top-10k', 'top-20k', 'top-50k', 'top-100k', 'rare'];
  const LEVEL_NAMES = { 'top-1000': 'Top 1000', 'top-2000': 'Top 2000', 'top-3000': 'Top 3000', 'top-5000': 'Top 5000',
    'top-10k': 'Top 10K', 'top-20k': 'Top 20K', 'top-50k': 'Top 50K', 'top-100k': 'Top 100K', 'rare': 'Rare' };
  const BAND_TIP = { 'top-1000': 'Among the 1,000 most used English words', 'top-2000': 'English words ranked 1,001–2,000',
    'top-3000': 'Ranked 2,001–3,000', 'top-5000': 'Ranked 3,001–5,000', 'top-10k': 'Ranked 5,001–10,000',
    'top-20k': 'Ranked 10,001–20,000', 'top-50k': 'Ranked 20,001–50,000', 'top-100k': 'Ranked 50,001–100,000',
    'rare': 'Less common than the 100,000 most used English words' };
  const TOPIC_NAMES = { food: 'Food', drinks: 'Drinks', sport: 'Sport', music: 'Music', art: 'Art', media: 'Media', tech: 'Tech',
    science: 'Science', medicine: 'Medicine', chemistry: 'Chemistry', physics: 'Physics', biology: 'Biology', math: 'Math',
    transport: 'Transport', clothing: 'Clothing', home: 'Home', business: 'Business', finance: 'Finance', politics: 'Politics',
    law: 'Law', military: 'Military', religion: 'Religion', education: 'Education', people: 'People', nature: 'Nature',
    places: 'Places', travel: 'Travel', games: 'Games', language: 'Language', units: 'Units', time: 'Time', emotions: 'Emotions',
    history: 'History', philosophy: 'Philosophy', other: 'Other' };
  const PAGE = 120;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  // saved ids are normalized (older builds wrote й/ї as two code points)
  const mine = new Set(store.get('sw.mine', []).map(id => String(id).normalize ? String(id).normalize('NFC') : String(id)));
  const state = { level: LEVELS[0], prev: LEVELS[0], view: store.get('sw.view', 'grid'), order: null, shuffled: false, idx: 0, topic: '', hideNs: store.get('sw.hideNs2', true) };
  const byLevel = {};
  LEVELS.forEach(l => byLevel[l] = []);
  WORDS.forEach(w => (byLevel[w.band] || (byLevel[w.band] = [])).push(w));

  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const plural = (n, w) => n.toLocaleString('en-US') + ' ' + (n === 1 ? w : /[^aeiou]y$/.test(w) ? w.slice(0, -1) + 'ies' : w + 's');
  const FLAG = '<svg class="flag" viewBox="0 0 60 30" aria-label="British English" role="img"><g clip-path="url(#fc)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ft)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg>';
  const SAY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
  const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const PIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M5 17l4.5-4.5 3 3 2.5-2.5L19 17"/></svg>';

  function shuffleIdx(n) {   // Fisher–Yates
    const a = Array.from({ length: n }, (_, i) => i);
    for (let i = n - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  // ---------- details (examples, notes, grammar) load per band, on first need
  const DET = window.DETAILS = window.DETAILS || {};
  const detLoads = {};
  function loadDetails(band) {
    if (!detLoads[band]) {
      detLoads[band] = new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'details-' + band + '.js'; s.async = true;
        s.onload = res; s.onerror = () => { delete detLoads[band]; rej(); };
        document.head.appendChild(s);
      });
    }
    return detLoads[band];
  }

  // ---------- audio: recorded words in bundles; each word knows [bundle, start, duration]
  const AUDIO = window.AUDIO || null;
  const canSpeak = 'speechSynthesis' in window;
  let actx = null, playing = null, seq = 0;
  const bundles = {}, lru = [], els = {};
  function speak(text) {
    if (!canSpeak) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = .9;
      const v = speechSynthesis.getVoices().find(v => v.lang === 'en-US') || speechSynthesis.getVoices().find(v => /^en/.test(v.lang));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function audioCtx() {
    if (!actx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try { actx = new C({ sampleRate: 24000 }); } catch (e) { actx = new C(); }
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    }
    return actx;
  }
  function loadBundle(i) {
    const k = lru.indexOf(i); if (k >= 0) lru.splice(k, 1);
    lru.push(i);
    while (lru.length > 3) delete bundles[lru.shift()];
    if (!bundles[i]) {
      bundles[i] = fetch('audio/' + AUDIO.chunks[i])
        .then(r => { if (!r.ok) throw new Error('audio ' + r.status); return r.arrayBuffer(); })
        .then(buf => new Promise((res, rej) => audioCtx().decodeAudioData(buf, res, rej)));
      bundles[i].catch(() => { delete bundles[i]; });
    }
    return bundles[i];
  }
  function playViaElement(w) {   // works when the page is opened from disk (file://)
    const a = els[w.au[0]] || (els[w.au[0]] = new Audio('audio/' + AUDIO.chunks[w.au[0]]));
    try { a.pause(); a.currentTime = Math.max(0, w.au[1] - 0.05); } catch (e) {}
    a.play().catch(() => speak(w.en));
    clearTimeout(a._t); a._t = setTimeout(() => a.pause(), (w.au[2] + 0.15) * 1000);
  }
  function playWord(w, btn) {
    if (!w) return;
    if (!AUDIO || !w.au) { speak(w.en); return; }
    if (location.protocol === 'file:') { playViaElement(w); return; }
    const c = audioCtx();
    if (!c) { playViaElement(w); return; }
    if (c.state === 'suspended') c.resume();
    const my = ++seq;
    if (btn) btn.classList.add('busy');
    const done = () => { if (btn) btn.classList.remove('busy'); };
    loadBundle(w.au[0]).then(buf => {
      done();
      if (my !== seq) return;               // a newer tap wins
      if (playing) { try { playing.stop(); } catch (e) {} }
      const src = c.createBufferSource();
      src.buffer = buf; src.connect(c.destination);
      src.start(0, Math.max(0, w.au[1] - 0.05), w.au[2] + 0.12);
      playing = src;
    }).catch(() => { done(); playViaElement(w); });
  }
  const canPlay = w => (AUDIO && w.au) || canSpeak;

  // ---------- stories: chapters of words in story order (stories.js, loaded when the tab is opened)
  const BY_EN = new Map(WORDS.map(w => [w.en, w]));
  let storiesLoad = null;
  function loadStories() {
    if (!storiesLoad) {
      storiesLoad = window.STORIES ? Promise.resolve() : new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'stories.js'; s.async = true;
        s.onload = res; s.onerror = () => { storiesLoad = null; rej(); };
        document.head.appendChild(s);
      });
    }
    return storiesLoad;
  }
  const isStory = level => /^story-/.test(level || '');
  function chapterOf(level) {
    const S = window.STORIES;
    if (!S || !isStory(level)) return null;
    const id = level.slice(6);
    const i = S.chapters.findIndex(c => c.id.toLowerCase() === id);
    return i < 0 ? null : { c: S.chapters[i], i: i };
  }

  // ---------- lists
  function baseList(level) {
    if (isStory(level)) {   // a story keeps all its words, in story order
      const ch = chapterOf(level);
      return ch ? ch.c.words.map(en => BY_EN.get(en)).filter(Boolean) : [];
    }
    let l = level === 'mine' ? WORDS.filter(w => mine.has(w.id)) : (byLevel[level] || []);
    if (state.hideNs) l = l.filter(w => !w.ns && !w.rude);
    return l;
  }
  function listFor(level) {
    const l = baseList(level);
    return state.topic ? l.filter(w => (w.topics || []).indexOf(state.topic) >= 0) : l;
  }
  function current() {
    const list = listFor(state.level);
    if (state.shuffled) {
      if (!state.order || state.order.length !== list.length) state.order = shuffleIdx(list.length);
      return state.order.map(i => list[i]);
    }
    return list;
  }

  // ---------- card text helpers
  function rankText(w) {
    if (!w.rank || w.band === 'rare') return 'Rare in English';
    if (w.approx) return 'About ' + LEVEL_NAMES[w.band].replace('Top', 'top') + ' word';
    return '#' + w.rank.toLocaleString('en-US') + ' most used word';
  }
  function stressed(w) {   // underline the stressed vowel (CMU pronouncing dictionary)
    if (!w.st) return esc(w.en);
    return esc(w.en.slice(0, w.st[0])) + '<span class="st">' + esc(w.en.slice(w.st[0], w.st[1])) + '</span>' + esc(w.en.slice(w.st[1]));
  }
  const longest = s => Math.max(4, ...String(s).split(/[\s-]+/).map(p => p.length));
  const IRREG = { person: 'person|people', foot: 'foot|feet', man: 'man|men', woman: 'woman|women', child: 'child|children',
    tooth: 'tooth|teeth', mouse: 'mouse|mice', goose: 'goose|geese', phenomenon: 'phenomenon|phenomena', elf: 'elf|elves',
    criterion: 'criterion|criteria', datum: 'datum|data', analysis: 'analysis|analyses', crisis: 'crisis|crises', leaf: 'leaf|leaves',
    thesis: 'thesis|theses', cactus: 'cactus|cacti', fungus: 'fungus|fungi', medium: 'medium|media', bacterium: 'bacterium|bacteria' };
  function mark(html, word) {   // bold the card's word (and its simple forms) inside an example
    const parts = word.replace(/[.]/g, '').split(/[\s-]+/).filter(Boolean).map(p => esc(p).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    if (!parts.length) return html;
    const last = parts.pop();
    let stem = last.length > 3 && /e$/i.test(last) ? last.slice(0, -1) + 'e?' : last;
    if (IRREG[last.toLowerCase()]) stem = '(?:' + IRREG[last.toLowerCase()] + ')';
    else if (/[^aeiou]y$/i.test(last)) stem = last.slice(0, -1) + '(?:y|ie)';
    try {
      const re = new RegExp('(^|[^\\p{L}])(' + parts.map(x => x + '[\\s-]+').join('') + stem + "(?:s|es|ed|d|ing|'s)?)(?![\\p{L}])", 'giu');
      return html.replace(re, '$1<b>$2</b>');
    } catch (e) { return html; }
  }

  function cardHTML(w, opts) {
    opts = opts || {};
    const on = mine.has(w.id);
    return '<div class="card" role="group" aria-roledescription="flip card" tabindex="0" data-id="' + esc(w.id) + '">' +
      '<div class="inner">' +
        '<div class="face front">' +
          (w.british ? FLAG : '') +
          '<div class="en" style="--n:' + longest(w.en) + '">' + stressed(w) + '</div><div class="eq">=</div>' +
          '<div class="uk" lang="uk" style="--n:' + longest(w.uk) + '">' + esc(w.uk) + '</div>' +
          (canPlay(w) ? '<button class="icon say" data-sayid="' + esc(w.id) + '" aria-label="Pronounce ' + esc(w.en) + '">' + SAY + '</button>' : '') +
          (opts.noAdd ? '' : '<button class="icon add' + (on ? ' on' : '') + '" data-add="' + esc(w.id) + '" aria-label="' + (on ? 'Remove from my words' : 'Add to my words') + '">' + (on ? CHECK : PLUS) + '</button>') +
        '</div>' +
        '<div class="face back" inert></div>' +    // filled on first flip
      '</div></div>';
  }
  function backHTML(w) {
    const d = DET[w.id];
    const ex = ((d && d.ex) || []).filter(Boolean);
    const tags = (d && d.tags) || [];
    const gram = (d && d.gram) || w.pos || '';
    return '<div class="top">' +
        (w.img ? '<div class="pic has"><img src="' + esc(w.img) + '" alt="" loading="lazy" decoding="async" onerror="this.parentNode.classList.remove(\'has\');this.remove()"></div>'
          : d && d.svg ? '<div class="pic emoji" aria-hidden="true"><img alt="" src="data:image/svg+xml;charset=utf-8,' + encodeURIComponent(d.svg) + '"></div>'
          : '<div class="pic" aria-hidden="true">' + PIC + '</div>') +
        '<div class="id">' +
          '<div class="head"><span>' + stressed(w) + '</span>' +
            (canPlay(w) ? '<button class="icon say-btn" data-sayid="' + esc(w.id) + '" aria-label="Pronounce ' + esc(w.en) + '">' + SAY + '</button>' : '') + '</div>' +
          (gram ? '<div class="meta">' + esc(gram) + '</div>' : '') +
          '<div class="rank">' + rankText(w) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="txt">' +
        (d && d.say ? '<div class="say-line"><span>Say:</span> ' + esc(d.say) + '</div>' : '') +
        (ex.length ? '<ol>' + ex.map(e => '<li>' + mark(esc(e), w.en) + '</li>').join('') + '</ol>' : (d ? '' : '<div class="loading">…</div>')) +
        (tags.length ? '<div class="tags">' + tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>' : '') +
        (d && d.note ? '<div class="note">' + esc(d.note) + '</div>' : '') +
      '</div>';
  }
  function fillBack(card) {
    const w = BY_ID.get(card.dataset.id), back = card.querySelector('.back');
    if (!w || !back) return;
    const draw = () => {
      back.innerHTML = backHTML(w);
      back.classList.toggle('more-below', back.scrollHeight > back.clientHeight + 2);
    };
    draw();
    if (!DET[w.id]) loadDetails(w.band).then(draw).catch(() => { const l = back.querySelector('.loading'); if (l) l.textContent = ''; });
  }
  function flip(card) {
    const back = card.querySelector('.back');
    if (!back.firstChild) fillBack(card);
    const f = card.classList.toggle('flipped');
    card.querySelector('.front').inert = f;
    back.inert = !f;
  }

  // ---------- header
  function renderLevels() {
    const items = LEVELS.filter(l => (byLevel[l] || []).length).map(l => [l, LEVEL_NAMES[l], null])
      .concat([['stories', 'Stories', null], ['mine', 'My words', baseList('mine').length], ['train', 'Train', null]]);
    const on = key => state.level === key || (key === 'stories' && isStory(state.level));
    $('#levels').innerHTML = items.map(([key, label, n]) =>
      (key === 'stories' ? '<span class="sep"></span>' : '') +
      '<button class="chip" id="lv-' + key + '" data-level="' + key + '" aria-pressed="' + on(key) + '"' +
      (BAND_TIP[key] ? ' title="' + BAND_TIP[key] + '"' : '') + '>' + label + (n !== null ? '<small>' + n + '</small>' : '') + '</button>').join('');
    const a = $('#levels [aria-pressed="true"]');
    if (a && a.scrollIntoView && window.innerWidth <= 640) a.scrollIntoView({ inline: 'center', block: 'nearest' });
  }
  function renderTopics() {
    const counts = {};
    baseList(state.level).forEach(w => (w.topics || []).forEach(t => counts[t] = (counts[t] || 0) + 1));
    if (state.topic && !counts[state.topic]) state.topic = '';
    const keys = Object.keys(counts).sort((a, b) => (a === 'other') - (b === 'other') || counts[b] - counts[a]);
    $('#topic').innerHTML = '<option value="">All topics</option>' + keys.map(k =>
      '<option value="' + k + '"' + (k === state.topic ? ' selected' : '') + '>' + (TOPIC_NAMES[k] || k) + ' · ' + counts[k] + '</option>').join('');
    $('#topic').hidden = !keys.length;
  }

  // ---------- main view
  function emptyMessage() {
    const all = state.level === 'mine' ? WORDS.filter(w => mine.has(w.id)).length : (byLevel[state.level] || []).length;
    if (!all) return state.level === 'mine' ? 'No words yet. Press + on a card to add it here.' : 'No words in this group yet.';
    return 'All cards here are hidden by "Hide slang" or the topic.';
  }
  function storyHTML(text) {   // [[word]] or [[form|word]] -> a highlighted, clickable word
    const unesc = s => s.replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
    return esc(text).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, form, en) => {
      const key = unesc((en || form).trim());
      const w = BY_EN.get(key);
      return w ? '<b class="sw" tabindex="0" lang="en" title="' + esc(w.en + ' = ' + w.uk) + '" data-sw="' + esc(key) + '">' + form + '</b>' : form;
    });
  }
  function renderTOC() {
    const S = window.STORIES;
    $('#count').textContent = plural(S.chapters.length, 'story');
    const used = S.parts.filter(p => S.chapters.some(c => c.part === p.id));
    $('#main').innerHTML = '<div class="toc">' +
      '<nav class="bar parts" aria-label="Parts">' + used.map(p => '<button class="chip" data-part="' + esc(p.id) + '">' + esc(p.title) + '</button>').join('') + '</nav>' +
      used.map(p => {
      const cs = S.chapters.filter(c => c.part === p.id);
      return '<section id="part-' + esc(p.id) + '"><h2>' + esc(p.title) + '</h2>' + (p.about ? '<p class="about">' + esc(p.about) + '</p>' : '') +
        '<div class="tiles">' + cs.map(c => '<a class="tile" href="#story-' + esc(c.id.toLowerCase()) + '">' +
          '<span class="tn">' + (S.chapters.indexOf(c) + 1) + (c.level ? ' · ' + esc(c.level) : '') + ' · ' + plural(c.words.length, 'word') + '</span>' +
          '<b>' + esc(c.title) + '</b><span class="tw">' + esc(c.words.slice(0, 6).join(' · ')) + '</span></a>').join('') +
        '</div></section>';
    }).join('') + '</div>';
  }
  function chapterTop(ch) {
    const S = window.STORIES, c = ch.c, part = S.parts.find(p => p.id === c.part);
    return '<div class="chapter">' +
      '<div class="ch-top"><a href="#stories">← All stories</a><span>' + esc(part ? part.title : '') + ' · ' + (ch.i + 1) + ' / ' + S.chapters.length + '</span></div>' +
      '<h2>' + esc(c.title) + '</h2>' +
      (c.story ? '<p class="story">' + storyHTML(c.story) + '</p>' : '') +
      '<div class="ch-actions"><button class="chip" id="ch-train">Train these words</button></div></div>';
  }
  function chapterNav(ch) {
    const S = window.STORIES, prev = S.chapters[ch.i - 1], next = S.chapters[ch.i + 1];
    return '<div class="ch-nav">' + (prev ? '<a href="#story-' + esc(prev.id.toLowerCase()) + '">← ' + esc(prev.title) + '</a>' : '<span></span>') +
      (next ? '<a href="#story-' + esc(next.id.toLowerCase()) + '">' + esc(next.title) + ' →</a>' : '') + '</div>';
  }
  function storyWord(en) {   // a word in the story: say it and show its card
    const w = BY_EN.get(en); if (!w) return;
    playWord(w);
    if (state.view === 'single') {
      const i = current().indexOf(w);
      if (i >= 0 && i !== state.idx) { state.idx = i; render(); }
    }
    const card = Array.from(document.querySelectorAll('.card')).find(c => c.dataset.id === w.id);
    if (!card) return;
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.add('flash'); setTimeout(() => card.classList.remove('flash'), 1200);
  }
  function render() {
    renderLevels();
    const training = state.level === 'train', toc = state.level === 'stories', story = isStory(state.level);
    if ((toc || story) && !window.STORIES) {
      $('#views').hidden = true; $('#count').textContent = '';
      $('#main').innerHTML = '<div class="blank">Loading stories…</div>';
      loadStories().then(render).catch(() => { $('#main').innerHTML = '<div class="blank">Stories could not be loaded.</div>'; });
      return;
    }
    if (!training && !toc && !story) renderTopics();
    $('#views').hidden = training || toc;
    ['v-shuffle', 'topic', 'f-ns'].forEach(id => { $('#' + id).style.display = story ? 'none' : ''; });   // a story keeps its order and all its words
    ['grid', 'single'].forEach(v => $('#v-' + v).setAttribute('aria-pressed', state.view === v));
    $('#v-shuffle').setAttribute('aria-pressed', state.shuffled);
    $('#f-ns').setAttribute('aria-pressed', state.hideNs);
    if (training) return renderTrain();
    if (toc) return renderTOC();
    const ch = story ? chapterOf(state.level) : null;
    if (story && !ch) { $('#count').textContent = ''; $('#main').innerHTML = '<div class="blank">This story was not found. <a href="#stories">All stories</a></div>'; return; }
    const top = ch ? chapterTop(ch) : '', bottom = ch ? chapterNav(ch) : '';
    const list = current();
    $('#count').textContent = list.length ? plural(list.length, 'word') : '';
    if (!list.length) { $('#main').innerHTML = top + '<div class="blank">' + emptyMessage() + '</div>' + bottom; return; }
    if (story) Array.from(new Set(list.map(w => w.band))).forEach(b => loadDetails(b).catch(() => {}));
    else if (state.level !== 'mine') loadDetails(state.level).catch(() => {});
    if (state.view === 'grid') {
      $('#main').innerHTML = top + '<div class="grid" id="grid"></div><div class="more" id="more"></div>' + bottom;
      appendCards();
    } else {
      state.idx = Math.max(0, Math.min(state.idx, list.length - 1));
      $('#main').innerHTML = top + '<div class="single">' + cardHTML(list[state.idx]) +
        '<div class="nav"><button class="chip" id="prev" aria-label="Previous">←</button>' +
        '<span class="count">' + (state.idx + 1) + ' / ' + list.length + '</span>' +
        '<button class="chip" id="next" aria-label="Next">→</button></div></div>' + bottom;
    }
  }
  const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => {
    if (es.some(e => e.isIntersecting) && state.view === 'grid' && state.level !== 'train') appendCards();
  }, { rootMargin: '1200px 0px' }) : null;
  function appendCards() {
    const g = $('#grid'), more = $('#more');
    if (!g) return;
    const list = current(), from = g.children.length, to = Math.min(list.length, from + PAGE);
    if (from >= to) return;
    g.insertAdjacentHTML('beforeend', list.slice(from, to).map(w => cardHTML(w)).join(''));
    if (to < list.length) {
      more.innerHTML = '<button class="chip" id="show-more">Show more · ' + (list.length - to) + '</button>';
      if (io) { io.disconnect(); io.observe(more); }
    } else { more.innerHTML = ''; if (io) io.disconnect(); }
  }

  // ---------- training (basic): see the Ukrainian word, recall the English word
  let tr = null;
  function startTrain() {
    let pool, note = '';
    if (state.trainPool) { pool = state.trainPool; note = 'Words from the story "' + state.trainTitle + '".'; }
    else {
      pool = baseList('mine');
      if (!pool.length) {
        pool = baseList(state.prev || LEVELS[0]).slice(0, 10);
        note = 'Sample words from ' + (LEVEL_NAMES[state.prev] || 'this group') + '. Add your own with + on any card.';
      }
    }
    pool = shuffleIdx(pool.length).map(i => pool[i]);
    tr = { queue: pool, i: 0, shown: false, known: 0, again: [], missed: new Set(), note: note, total: pool.length, round: 1 };
  }
  function renderTrain() {
    if (!tr) startTrain();
    $('#count').textContent = '';
    if (!tr.total) { $('#main').innerHTML = '<div class="blank">No words to train yet.</div>'; return; }
    if (tr.i >= tr.queue.length) {
      if (tr.again.length) { tr.queue = tr.again; tr.again = []; tr.i = 0; tr.round++; }
      else {
        $('#main').innerHTML = '<div class="train"><div class="score">' + tr.known + ' / ' + tr.total + '</div>' +
          '<div class="hint">known on the first try</div><div class="row"><button class="chip big primary" id="t-restart">Train again</button></div></div>';
        return;
      }
    }
    const w = tr.queue[tr.i];
    $('#main').innerHTML = '<div class="train">' +
      (tr.note ? '<div class="hint">' + esc(tr.note) + '</div>' : '') +
      '<div class="card"><div class="inner"><div class="face front">' +
        '<div class="uk" lang="uk" style="--n:' + longest(w.uk) + '">' + esc(w.uk) + '</div><div class="eq">=</div>' +
        '<div class="en" style="--n:' + longest(w.en) + '">' + (tr.shown ? stressed(w) : '?') + '</div>' +
        (tr.shown && canPlay(w) ? '<button class="icon say" data-sayid="' + esc(w.id) + '" aria-label="Pronounce">' + SAY + '</button>' : '') +
      '</div></div></div>' +
      '<div class="row">' + (tr.shown
        ? '<button class="chip big" id="t-again">Again</button><button class="chip big primary" id="t-know">I knew it</button>'
        : '<button class="chip big primary" id="t-show">Show English</button>') + '</div>' +
      '<div class="count">' + (tr.round > 1 ? 'Round ' + tr.round + ' · ' : '') + (tr.i + 1) + ' / ' + tr.queue.length + '</div></div>';
  }
  function trainAnswer(knew) {
    const w = tr.queue[tr.i];
    if (knew) { if (!tr.missed.has(w.id)) tr.known++; } else { tr.missed.add(w.id); tr.again.push(w); }
    tr.i++; tr.shown = false; renderTrain();
  }

  // ---------- events
  let swiped = false;
  document.addEventListener('click', e => {
    if (swiped) { swiped = false; return; }
    const sw = e.target.closest && e.target.closest('.sw');
    if (sw) { storyWord(sw.dataset.sw); return; }
    const t = e.target.closest('button, .card');
    if (!t) return;
    if (t.dataset.part) { const sec = document.getElementById('part-' + t.dataset.part); if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (t.id === 'ch-train') {
      const ch = chapterOf(state.level);
      if (ch) { state.trainPool = current().slice(); state.trainTitle = ch.c.title; go('train'); }
      return;
    }
    if (t.dataset.sayid) { e.stopPropagation(); playWord(BY_ID.get(t.dataset.sayid), t); return; }
    if (t.dataset.add) {
      e.stopPropagation();
      const id = t.dataset.add;
      mine.has(id) ? mine.delete(id) : mine.add(id);
      store.set('sw.mine', Array.from(mine));
      if (state.level === 'mine' && !mine.has(id)) {
        const c = t.closest('.card'); if (c) c.remove();
        const n = baseList('mine').length;
        if (!n) { render(); return; }
        $('#count').textContent = plural(n, 'word');
        renderLevels(); return;
      }
      t.classList.toggle('on', mine.has(id)); t.innerHTML = mine.has(id) ? CHECK : PLUS;
      t.setAttribute('aria-label', mine.has(id) ? 'Remove from my words' : 'Add to my words');
      renderLevels(); return;
    }
    if (e.detail && t.closest('header, .tools')) t.blur();   // after a mouse click, Space/arrows go back to the cards
    if (t.dataset.level) { go(t.dataset.level); return; }
    if (t.dataset.view) { state.view = t.dataset.view; store.set('sw.view', state.view); render(); return; }
    if (t.id === 'v-shuffle') { state.shuffled = !state.shuffled; state.order = null; state.idx = 0; render(); return; }
    if (t.id === 'f-ns') { state.hideNs = !state.hideNs; store.set('sw.hideNs2', state.hideNs); state.order = null; state.idx = 0; tr = null; render(); return; }
    if (t.id === 'show-more') { appendCards(); return; }
    if (t.id === 'prev') { move(-1); return; }
    if (t.id === 'next') { move(1); return; }
    if (t.id === 't-show') { tr.shown = true; renderTrain(); playWord(tr.queue[tr.i]); return; }
    if (t.id === 't-know') { trainAnswer(true); return; }
    if (t.id === 't-again') { trainAnswer(false); return; }
    if (t.id === 't-restart') { tr = null; renderTrain(); return; }
    if (t.classList.contains('card') && !t.closest('.train')) {
      if (String(window.getSelection ? getSelection() : '')) return;   // selecting text should not flip
      flip(t);
    }
  });
  $('#topic').addEventListener('change', e => { state.topic = e.target.value; state.order = null; state.idx = 0; render(); });
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, textarea, select')) return;
    if (state.level === 'train') {
      if (!tr) return;
      if ((e.key === ' ' || e.key === 'Enter') && !tr.shown && $('#t-show')) { e.preventDefault(); $('#t-show').click(); }
      else if ((e.key === '1' || e.key === 'ArrowLeft') && tr.shown) trainAnswer(false);
      else if ((e.key === '2' || e.key === 'ArrowRight') && tr.shown) trainAnswer(true);
      return;
    }
    if ((e.key === 'Enter' || e.key === ' ') && document.activeElement && document.activeElement.classList.contains('sw')) {
      e.preventDefault(); storyWord(document.activeElement.dataset.sw); return;
    }
    if (state.level === 'stories') return;
    if (e.key === 'ArrowRight' && state.view === 'single') move(1);
    else if (e.key === 'ArrowLeft' && state.view === 'single') move(-1);
    else if (e.key === ' ' || e.key === 'Enter') {
      const a = document.activeElement;
      if (a && a.tagName === 'BUTTON') return;
      const card = a && a.classList && a.classList.contains('card') ? a
        : (state.view === 'single' && (!a || a === document.body) ? document.querySelector('.single .card') : null);
      if (card) { e.preventDefault(); flip(card); }
    }
  });
  let sx = null;   // swipe left/right in One by one view
  document.addEventListener('pointerdown', e => { sx = e.target.closest && e.target.closest('.single .card') ? [e.clientX, e.clientY] : null; });
  document.addEventListener('pointerup', e => {
    if (!sx) return;
    const dx = e.clientX - sx[0], dy = e.clientY - sx[1];
    sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > 1.5 * Math.abs(dy)) { swiped = true; move(dx < 0 ? 1 : -1); setTimeout(() => { swiped = false; }, 400); }
  });
  function move(d) {
    const n = current().length; if (!n) return;
    state.idx = (state.idx + d + n) % n; render();
    const c = document.querySelector('.single .card'); if (c) c.focus({ preventScroll: true });
  }
  const keepsPrev = level => level !== 'train' && level !== 'mine' && level !== 'stories';
  function go(level) {
    if (keepsPrev(level)) state.prev = level;
    if (location.hash.slice(1) !== level) { location.hash = level; return; }   // hashchange renders, so Back works
    open(level);
  }
  function open(level) {
    if (level === 'train' || state.level === 'train') tr = null;
    if (level !== 'train') state.trainPool = null;
    if (keepsPrev(level)) state.prev = level;
    state.level = level; state.order = null; state.idx = 0;
    render();
    if (isStory(level) || level === 'stories') window.scrollTo(0, 0);
  }
  function fromHash() {
    const h = (location.hash || '').slice(1).toLowerCase();
    if (LEVELS.indexOf(h) >= 0 || h === 'mine' || h === 'train' || h === 'stories' || isStory(h)) return h;
    return LEVELS.find(x => (byLevel[x] || []).length) || LEVELS[0];
  }
  window.addEventListener('hashchange', () => open(fromHash()));
  if (canSpeak) { try { speechSynthesis.getVoices(); } catch (e) {} }
  open(fromHash());
})();
</script>
